        function parseDraft(item) {
          const l = getLessonObj(findClass(item.classId), item.lid);
          if (!l) return { ok: false, message: "درس پیش‌نویس موجود نیست." };
          if (item.kind === "pod") {
            if (
              l.gradingPolicy?.method !== "modular" ||
              !["m", "c"].includes(item.field)
            )
              return { ok: false, message: "نوع نمره پودمان نامعتبر است." };
            return EduPolicy.parse(
              item.value,
              l.gradingPolicy,
              item.field,
              item.kind,
            );
          }
          return parseGrade(item.value);
        }

        function validateCourse(l, ids, year) {
          if (l.gradingPolicy) {
            EduPolicy.validate(l.gradingPolicy);
            if (l.gradingPolicy.year !== year)
              throw Error(
                "سال قواعد درس با دوره تحصیلی یکسان نیست؛ برای سال جدید دوره مستقل بسازید.",
              );
            const p = l.gradingPolicy;
            if ((l.gradeMode === "kardanesh") !== (p.method === "dual"))
              throw Error("روش درس با قواعد آن یکسان نیست.");
            if (
              p.method === "modular" &&
              (!l.poudmans.length ||
                l.poudmans.length > 20 ||
                l.poudmans.some((x) => !x.units.length || x.units.length > 10))
            )
              throw Error("ساختار پودمان و واحد معتبر نیست.");
          }
          for (const pod of l.poudmans || []) {
            if (pod.podScores === undefined) continue;
            if (
              !pod.podScores ||
              typeof pod.podScores !== "object" ||
              Array.isArray(pod.podScores)
            )
              throw Error("نمرات پودمان نامعتبر است.");
            for (const [sid, g] of Object.entries(pod.podScores)) {
              if (
                !ids.has(sid) ||
                !g ||
                typeof g !== "object" ||
                Array.isArray(g)
              )
                throw Error("دانش‌آموز یا نمره پودمان نامعتبر است.");
              if (g.gate !== undefined && typeof g.gate !== "boolean")
                throw Error("وضعیت معیارهای الزامی نامعتبر است.");
              for (const field of ["m", "c"])
                if (g[field] != null) {
                  if (
                    typeof g[field] !== "number" ||
                    !Number.isFinite(g[field]) ||
                    l.gradingPolicy?.method !== "modular"
                  )
                    throw Error("نمره پودمان فاقد قواعد معتبر است.");
                  if (
                    !EduPolicy.parse(
                      String(g[field]),
                      l.gradingPolicy,
                      field,
                      "pod",
                    ).ok
                  )
                    throw Error("بازه یا گام نمره پودمان نامعتبر است.");
                }
            }
          }
        }

          return label;

            if (!l?.gradingPolicy) continue;
            const r = EduPolicy.moduleResult(
              l.gradingPolicy,
              pod.podScores?.[sid],
            );
            el.textContent = el.dataset.podFinal
              ? finalText(r)
              : policyStatus(r);

          for (const el of document.querySelectorAll(
            "[data-course-final],[data-course-mean],[data-course-status]",

                el.dataset.courseFinal ||
                el.dataset.courseMean ||

              [lid, sid] = key.split("|"),

              ? finalText(r)

    <script>
      (function () {

            for(const th of table.querySelectorAll("thead th"))if(!th.hasAttribute("scope"))th.setAttribute("scope",th.colSpan>1?"colgroup":"col");
            const identity=Math.max(0,labels.findIndex(t=>/دانش‌آموز|هنرجو|نام|درس|سال.*نوبت/.test(t)));
            for(const row of bodyRows){
              for(const [i,cell] of [...row.cells].entries()){
                const label=labels[i]||"عملیات";
                if(simple&&cell.dataset.label!==label)cell.dataset.label=label;
                if(i===identity&&!cell.hasAttribute("data-identity"))cell.setAttribute("data-identity","");
                const actions=simple&&(/عملیات|تصمیم/.test(label)||(!labels[i]&&cell.querySelector("button")));
                if(actions&&!cell.hasAttribute("data-actions"))cell.setAttribute("data-actions","");

        function polishExperience(){

          }

            const empty=state.view==="schools"?!db.schools.length:state.view==="school"?!db.schools.find(s=>s.id===state.schoolId)?.classes.length:!getClassObj(state.schoolId,state.classId)?.students.length;
            detail.open=!!empty;heading.remove();detail.append(summary);
            while(card.firstChild)detail.append(card.firstChild);
            card.replaceWith(detail);

          for(const card of app?.querySelectorAll(".card")||[]){
            const items=[...card.children].filter(el=>el.matches(".list-item[onclick]"));
            if(items.length<4||card.querySelector(".list-search"))continue;
            const box=document.createElement("div");box.className="list-search no-print";
            const input=document.createElement("input");input.type="search";input.placeholder="جست‌وجو در این فهرست…";input.setAttribute("aria-label","جست‌وجو در فهرست");
            const result=document.createElement("p");result.className="search-feedback";result.setAttribute("role","status");result.hidden=true;
            const normalize=s=>s.replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/\s+/g," ").trim();
            input.oninput=()=>{const query=normalize(input.value);let count=0;for(const item of items){const match=normalize(item.textContent).includes(query);item.hidden=!match;if(match)count++;}result.hidden=!query;result.textContent=count?count.toLocaleString("fa-IR")+" مورد پیدا شد":"موردی پیدا نشد؛ عبارت دیگری وارد کنید.";};
            box.append(input,result);items[0].before(box);
          }
          for(const input of document.querySelectorAll('#app input[placeholder],#modalBody input[placeholder],#modalBody textarea[placeholder]')){
            if(!input.hasAttribute("aria-label")&&!input.labels?.length)input.setAttribute("aria-label",input.placeholder);
          }

        function mobileExperience(){

          if(tools&&bar){
            for(const button of [...bar.children].filter(x=>x.tagName==="BUTTON"))tools.querySelector(".tool-actions")?.prepend(button);

        function enhance() {
          mobileExperience();
          polishExperience();
          updateDesign();
          pending = false;
          for (const table of document.querySelectorAll(
            "#app table,#modalBody table",
          )) {
            if (!table.dataset.responsiveSized) {
              const columns = Math.max(

                  .slice(0, 3)

                    [...row.cells].reduce((n, cell) => n + cell.colSpan, 0),

          for (const container of document.querySelectorAll(".table-scroll")) {
            if (!container.hasAttribute("tabindex")) {
              container.tabIndex = 0;

            }
          }
          for (const table of document.querySelectorAll(
            "#app table,#modalBody table",
          )) {
            if (table.closest(".responsive-scroll,.table-scroll")) continue;
            const wrap = document.createElement("div");
            wrap.className = "responsive-scroll";
            wrap.tabIndex = 0;
            wrap.setAttribute("role", "region");
            wrap.setAttribute(
              "aria-label",
              "جدول؛ برای دیدن ستون‌های دیگر افقی پیمایش کنید",
            );
            table.before(wrap);
            wrap.append(table);
          }
          styleDataTables();
          for (const grid of document.querySelectorAll("#app .schedule-grid")) {
            if (grid.parentElement.classList.contains("responsive-scroll"))
              continue;
            const wrap = document.createElement("div");
            wrap.className = "responsive-scroll";
            wrap.tabIndex = 0;
            wrap.setAttribute("role", "region");

            wrap.append(grid);
          }
          const bar = document.querySelector(".workspace-bar");
          if (bar && !bar.querySelector(".workspace-tools")) {
            const tools = document.createElement("details");
            tools.className = "workspace-tools no-print";
            tools.innerHTML =
              '<summary>مدیریت و پشتیبان‌ها</summary><div class="tool-actions"></div>';
            const box = tools.querySelector(".tool-actions");
            for (const button of [...bar.querySelectorAll("button")])
              box.append(button);
            for (const small of [...bar.querySelectorAll("small")])
              box.append(small);
            const backup = document.createElement("button");
            backup.className = "ghost";
            backup.textContent = "ذخیره پشتیبان";

              exportBackup().catch((e) => alert(e.message));
            box.prepend(backup);
            bar.append(tools);
          }
          const topbar = document.querySelector(".topbar"),
            actions = topbar?.querySelector(".actions");

            const menu = document.createElement("details");

            menu.innerHTML = "<summary title=\"ابزارها و تنظیمات\"><span class=\"menu-toggle-label\">فهرست برنامه</span><svg class=\"menu-toggle-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path class=\"menu-line-top\" d=\"M5 12h14\"/><path class=\"menu-line-middle\" d=\"M5 12h14\"/><path class=\"menu-line-bottom\" d=\"M5 12h14\"/></svg></summary>";
            actions.before(menu);
            menu.append(actions);
            menu.addEventListener("toggle",()=>{if(!menu.open){closeClassMenu();closeDataMenu();}});
            actions.addEventListener("click",e=>{const button=e.target.closest("button");if(button&&!button.hasAttribute("aria-controls")&&matchMedia("(max-width:700px), (max-width:1000px) and (pointer:coarse)").matches)menu.open=false;});
            const settings = actions.querySelector(
              'button[onclick="openSettingsModal()"]',
            );
            if (settings) {
              settings.setAttribute("aria-label", "تنظیمات برنامه");
              settings.title = "تنظیمات برنامه";
            }
          }
        }
        function schedule() {
          if (!pending) {
            pending = true;
            requestAnimationFrame(enhance);
          }
        }
        let wideLayout;
        function viewport() {
          document.documentElement.style.setProperty(
            "--app-viewport",
            (window.visualViewport?.height || innerHeight) + "px",
          );
          const wide = innerWidth > 700 && !matchMedia("(max-width:1000px) and (pointer:coarse)").matches;
          if (wide !== wideLayout) {
            wideLayout = wide;
            for (const menu of document.querySelectorAll(".navigation-menu"))
              menu.open = wide;
          }
        }
        function start() {
          for (const el of [
            document.getElementById("app"),
            document.getElementById("modalBody"),
          ])
            if (el)
              new MutationObserver(schedule).observe(el, {
                childList: true,
                subtree: true,
              });
          enhance();
          viewport();
          window.visualViewport?.addEventListener("resize", viewport);
          window.addEventListener("resize", viewport);
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", start);
        else start();
      })();

    <script>
      (function () {
        "use strict";
        let registration,
          installEvent,
          pendingUpdate = false,
          offlineReady = false;
        let updateMessage="", updateTimer;
        function text(message) {
          const el = document.getElementById("mobileStatus");
          if (el) el.textContent = message;
        }
        function paint() {
          if (!document.getElementById("mobileInstall")) return;
          if (location.protocol === "file:") {
            text("فایل مستقل آفلاین؛ نصب PWA از لینک امن انجام می‌شود.");
            return;
          }
          const status = offlineReady
            ? navigator.onLine
              ? "آماده اجرای آفلاین"
              : "آفلاین — اطلاعات روی دستگاه ذخیره می‌شود"
            : "در حال آماده‌سازی اجرای آفلاین…";
          text(updateMessage || status);
          document.getElementById("mobileBar").dataset.offlineReady=String(offlineReady);
          document.getElementById("mobileBar").dataset.updateError=String(!!updateMessage);
          document.getElementById("mobileInstall").hidden =
            !installEvent ||
            matchMedia("(display-mode: standalone)").matches ||
            !!navigator.standalone;
          document.getElementById("mobileUpdate").hidden =
            !registration?.waiting;
        }

        const installNoticeKey = "edu-manager:pwa-notice:v1";
        const isInstalled = () =>
          matchMedia("(display-mode: standalone)").matches ||
          !!navigator.standalone;
        function rememberInstallNotice() {
          try {
            localStorage.setItem(installNoticeKey, "seen");
          } catch {}
        }
        function closeInstallNotice() {
          const d = document.getElementById("pwaWelcome");
          if (d) {
            d.close?.();
            d.remove();
          }
        }
        function paintInstallNotice() {
          const button = document.getElementById("pwaWelcomeInstall");
          if (button)
            button.textContent = installEvent
              ? "نصب برنامه روی دستگاه"
              : "راهنمای نصب روی دستگاه";
          const status = document.getElementById("pwaWelcomeStatus");
          if (status)
            status.textContent = offlineReady
              ? "✓ فایل‌های برنامه برای اجرای آفلاین ذخیره شدند."
              : "در حال دریافت فایل‌های اجرای آفلاین؛ فعلاً اینترنت را متصل نگه دارید.";
        }
        async function requestInstall() {
          if (!installEvent) {
            closeInstallNotice();
            help();
            return;
          }
          const event = installEvent;
          installEvent = null;
          try {
            await event.prompt();
            const choice = await event.userChoice;
            if (choice.outcome === "accepted") {
              rememberInstallNotice();
              closeInstallNotice();
            }
          } catch {
            closeInstallNotice();
            help();
          }
          paint();
          paintInstallNotice();
        }
        function firstVisitInstall() {
          if (
            location.protocol === "file:" ||
            !isSecureContext ||
            isInstalled()
          )
            return;
          try {
            if (localStorage.getItem(installNoticeKey) === "seen") return;
          } catch {}
          const d = document.createElement("dialog");
          d.id = "pwaWelcome";
          d.setAttribute("aria-labelledby", "pwaWelcomeTitle");
          d.style.cssText =
            "box-sizing:border-box;direction:rtl;font-family:IRANSans,Tahoma,sans-serif;width:min(440px,calc(100% - 24px));max-height:calc(100dvh - 32px);overflow:auto;border:0;border-radius:20px;padding:24px;color:#1e293b;background:#fff;box-shadow:0 16px 64px #0004;line-height:1.9";
          d.innerHTML =
            '<h2 id="pwaWelcomeTitle" style="font-size:1.2rem;margin:0 0 12px">برنامه را روی دستگاهت نصب کن</h2><p>برای دسترسی از صفحه اصلی و استفاده بدون اینترنت، مدیریت کلاس را نصب کن.</p><p id="pwaWelcomeStatus" role="status" aria-live="polite"></p><p style="font-size:.9rem">در آیفون و آیپد: منوی اشتراک‌گذاری (Share) ← افزودن به صفحه اصلی (Add to Home Screen). در اندروید و رایانه از دکمه نصب یا منوی مرورگر استفاده کن.</p><div style="display:flex;flex-wrap:wrap;gap:8px"><button id="pwaWelcomeInstall" type="button" style="flex:1;min-height:44px">نصب برنامه روی دستگاه</button><button id="pwaWelcomeLater" type="button" class="ghost" style="min-height:44px">فعلاً ادامه می‌دهم</button></div>';
          document.body.append(d);
          d.querySelector("#pwaWelcomeInstall").onclick = requestInstall;
          d.querySelector("#pwaWelcomeLater").onclick = () => {
            rememberInstallNotice();
            closeInstallNotice();
          };
          d.addEventListener("cancel", () => {
            rememberInstallNotice();
          });
          if (d.showModal) d.showModal();
          else d.setAttribute("open", "");
          paintInstallNotice();
        }

        function shell() {
          const bar = document.createElement("aside");
          bar.className = "mobile-bar no-print";
          bar.id = "mobileBar";
          bar.innerHTML =
            '<strong>مدیریت کلاس</strong><span id="mobileStatus" role="status" aria-live="polite"></span><button id="mobileInstall" hidden>نصب برنامه</button><button id="mobileUpdate" hidden>نسخه جدید آماده است</button><button id="mobileHelp" class="ghost">نصب و راهنما</button>';
          document.body.prepend(bar);
          document.getElementById("mobileInstall").onclick = requestInstall;
          document.getElementById("mobileUpdate").onclick = update;
          document.getElementById("mobileHelp").onclick = help;
        }
        function help() {
          const installed =
            matchMedia("(display-mode: standalone)").matches ||
            navigator.standalone;
          const html =
            "<p>" +
            (installed
              ? "برنامه از آیکن نصب‌شده اجرا شده است."
              : "در اندروید و رایانه از گزینه «نصب برنامه» مرورگر استفاده کنید. در آیفون و آیپد از اشتراک‌گذاری و «افزودن به صفحه اصلی» استفاده کنید.") +
            "</p><p>دریافت اولیه و به‌روزرسانی به اینترنت نیاز دارد. بعد از نمایش «آماده اجرای آفلاین»، برنامه بدون اینترنت باز می‌شود. یک بار از آیکن نصب‌شده باز کنید و آماده‌بودن را بررسی کنید.</p><p>اطلاعات هر دستگاه و مرورگر جداست. برای انتقال اطلاعات، از داده‌ها «پشتیبان» بگیرید و فایل را در دستگاه دیگر بازیابی کنید. پاک‌کردن داده‌های مرورگر یا حذف برنامه ممکن است اطلاعات این دستگاه را پاک کند؛ فایل مستقل را نگه دارید.</p><p>این برنامه همگام‌سازی خودکار بین دستگاه‌ها ندارد.</p>";
          if (window.showModal) showModal("نصب و استفاده آفلاین", html);
          else
            alert(
              "پس از نمایش آماده اجرای آفلاین، برنامه را از منوی مرورگر روی صفحه اصلی نصب کنید.",
            );
        }
        async function status() {
          const worker =
            navigator.serviceWorker.controller || registration?.active;
          if (!worker) return;
          const channel = new MessageChannel();
          channel.port1.onmessage = (e) => {
            offlineReady = e.data?.ready === true;
            paint();
            paintInstallNotice();
            channel.port1.close();
          };
          worker.postMessage({ type: "OFFLINE_STATUS" }, [channel.port2]);
        }

        async function update() {
          if(pendingUpdate)return;
          const button=document.getElementById("mobileUpdate");
          try{
            if(!registration?.waiting){await registration?.update();if(!registration?.waiting){updateMessage="هنوز نسخه جدید برای اعمال آماده نیست؛ چند لحظه دیگر تلاش کنید.";paint();return;}}
            button.disabled=true;
            updateMessage="در حال ذخیره ویرایش‌ها پیش از به‌روزرسانی…";paint();
            await window.EduV24?.flushDrafts({strict:true});
            if(!confirm("ویرایش‌های این پنجره ذخیره شدند. نسخه جدید در همین پنجره باز شود؟")){updateMessage="";button.disabled=false;paint();return;}
            pendingUpdate=true;updateMessage="در حال اعمال نسخه جدید…";paint();
            updateTimer=setTimeout(()=>{pendingUpdate=false;button.disabled=false;updateMessage="اعمال نسخه کامل نشد؛ برنامه را با اینترنت دوباره باز کنید و تلاش کنید.";paint();},15000);
            registration.waiting.postMessage({type:"APPLY_UPDATE"});
          }catch(e){clearTimeout(updateTimer);pendingUpdate=false;button.disabled=false;updateMessage=e.message||"ابتدا ویرایش‌های ذخیره‌نشده را بررسی کنید.";paint();}
        }

        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          installEvent = e;
          paint();
          paintInstallNotice();
        });
        window.addEventListener("appinstalled", () => {
          installEvent = null;
          rememberInstallNotice();
          closeInstallNotice();
          paint();
        });
        window.addEventListener("online", paint);
        window.addEventListener("offline", paint);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible" && navigator.onLine)
            registration?.update().catch(() => {});
        });
        window.addEventListener("load", async () => {
          shell();
          firstVisitInstall();
          if (location.protocol === "file:") {
            text(
              "فایل مستقل آفلاین؛ نصب استاندارد PWA از لینک امن انجام می‌شود.",
            );
            return;
          }
          if (!("serviceWorker" in navigator) || !window.isSecureContext) {
            text("نصب آفلاین به مرورگر جدید و لینک HTTPS نیاز دارد.");
            return;
          }
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (pendingUpdate) { clearTimeout(updateTimer); location.reload(); }
            else status();
          });
          navigator.serviceWorker.addEventListener("message", (e) => {
            if (e.data?.type === "UPDATE_BLOCKED") {
              clearTimeout(updateTimer);
              pendingUpdate = false;
              document.getElementById("mobileUpdate").disabled = false;
              updateMessage="به‌روزرسانی متوقف شد: برنامه در پنجره دیگری باز است.";
              paint();
              if(window.showModal)showModal("برای به‌روزرسانی، پنجره‌های دیگر را ببندید","<p>این برنامه هم‌زمان در بیش از یک تب یا پنجره باز است. پنجره نصب‌شده روی گوشی هم محسوب می‌شود.</p><p>ویرایش‌ها را ذخیره کنید؛ همه پنجره‌های دیگر این برنامه را ببندید، فقط همین پنجره را نگه دارید و دوباره «نسخه جدید آماده است» را بزنید.</p><p>حذف برنامه یا پاک‌کردن اطلاعات مرورگر لازم نیست.</p>");
            }
          });
          try {
            registration = await navigator.serviceWorker.register(
              "./service-worker.js",
              { updateViaCache: "none" },
            );
            function watchInstalling() {
              const worker = registration.installing;
              worker?.addEventListener("statechange", () => {
                if (worker.state === "installed") {
                  paint();
                  status();
                }
                if (worker.state === "redundant" && !offlineReady)
                  text(
                    "دانلود آفلاین کامل نشد؛ اینترنت را بررسی و دوباره تلاش کنید.",
                  );
              });
            }
            registration.addEventListener("updatefound", watchInstalling);
            watchInstalling();
            await Promise.race([
              navigator.serviceWorker.ready,
              new Promise((_, reject) =>
                setTimeout(
                  () => reject(Error("Offline setup timed out")),
                  30000,
                ),
              ),
            ]);
            await status();
            paint();
          } catch (e) {
            text(
              "آماده‌سازی آفلاین کامل نشد؛ اینترنت را بررسی و برنامه را دوباره باز کنید.",
            );
          }
        });
        window.EduPWA = {
          getStatus: () => ({
            offlineReady,
            waiting: !!registration?.waiting,
            installed:
              matchMedia("(display-mode: standalone)").matches ||
              !!navigator.standalone,
          }),
          help,
        };
      })();
    </script>
  </body>
</html>
