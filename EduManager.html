        function adoptDrafts(key) {
          const prefix = "Edu24.drafts." + workspace.id + ".";
          if (!key.startsWith(prefix) || key === draftStorageKey())
            throw Error("کلید معتبر نیست.");
          const parsed = JSON.parse(localStorage.getItem(key) || "null"),
            items = Array.isArray(parsed) ? parsed : parsed?.entries || [];
          if (!Array.isArray(items)) throw Error("پیش‌نویس نامعتبر است.");
          for (const original of items) {
            if (
              !original ||
              !["k", "u"].includes(original.kind) ||
              typeof original.value !== "string" ||
              original.value.length > 100
            )
              throw Error("ورودی نامعتبر است.");
            const item = {
              ...original,
              review: true,
              error: "بازیابی از نشست دیگر؛ نیازمند بررسی",
            };
            drafts.set(inputKey(item), item);
          }
          storeDrafts();
          reviewDrafts();
        }

        function broadcast(message) {
          try {
            if (channel) channel.postMessage(message);
          } catch (ignore) {}
        }
        function draftBaseKey() {
          return "Edu24.drafts." + workspace.id + "." + tabId;
        }
        function fileModeBanner(app) {
          const warning = document.createElement("div");
          warning.id = "fileMigrationBanner";
          warning.className = "card";
          const title = document.createElement("h3");
          title.textContent = "حالت انتقال سوابق؛ فقط خواندنی";
          const text = document.createElement("p");
          text.textContent =
            "برای استفاده روزمره، Start-EduManager.cmd را در همین پوشه اجرا کنید. ابتدا فایل پشتیبان سوابق قبلی را دریافت و سپس در برنامه محلی بازیابی کنید.";
          const button = document.createElement("button");
          button.textContent = "دریافت فایل انتقال سوابق";
          button.onclick = () => exportBackup();
          warning.append(title, text, button);
          app.prepend(warning);
        }
        function parseDraft(item) {
          const l = getLessonObj(findClass(item.classId), item.lid);
          if (!l) return { ok: false, message: "درس پیش‌نویس موجود نیست." };
          if (item.kind === "pod") {
            if (
              l.gradingPolicy?.method !== "modular" ||
              !["m", "c"].includes(item.field)
            )
              return { ok: false, message: "نوع نمره پودمان نامعتبر است." };
            return EduPolicy.parse(
              item.value,
              l.gradingPolicy,
              item.field,
              item.kind,
            );
          }
          return parseGrade(item.value);
        }

        function validateCourse(l, ids, year) {
          if (l.gradingPolicy) {
            EduPolicy.validate(l.gradingPolicy);
            if (l.gradingPolicy.year !== year)
              throw Error(
                "سال قواعد درس با دوره تحصیلی یکسان نیست؛ برای سال جدید دوره مستقل بسازید.",
              );
            const p = l.gradingPolicy;
            if ((l.gradeMode === "kardanesh") !== (p.method === "dual"))
              throw Error("روش درس با قواعد آن یکسان نیست.");
            if (
              p.method === "modular" &&
              (!l.poudmans.length ||
                l.poudmans.length > 20 ||
                l.poudmans.some((x) => !x.units.length || x.units.length > 10))
            )
              throw Error("ساختار پودمان و واحد معتبر نیست.");
          }
          for (const pod of l.poudmans || []) {
            if (pod.podScores === undefined) continue;
            if (
              !pod.podScores ||
              typeof pod.podScores !== "object" ||
              Array.isArray(pod.podScores)
            )
              throw Error("نمرات پودمان نامعتبر است.");
            for (const [sid, g] of Object.entries(pod.podScores)) {
              if (
                !ids.has(sid) ||
                !g ||
                typeof g !== "object" ||
                Array.isArray(g)
              )
                throw Error("دانش‌آموز یا نمره پودمان نامعتبر است.");
              if (g.gate !== undefined && typeof g.gate !== "boolean")
                throw Error("وضعیت معیارهای الزامی نامعتبر است.");
              for (const field of ["m", "c"])
                if (g[field] != null) {
                  if (
                    typeof g[field] !== "number" ||
                    !Number.isFinite(g[field]) ||
                    l.gradingPolicy?.method !== "modular"
                  )
                    throw Error("نمره پودمان فاقد قواعد معتبر است.");
                  if (
                    !EduPolicy.parse(
                      String(g[field]),
                      l.gradingPolicy,
                      field,
                      "pod",
                    ).ok
                  )
                    throw Error("بازه یا گام نمره پودمان نامعتبر است.");
                }
            }
          }
        }

        function policyStatus(r) {
          let label =
            r.passed === false
              ? "نیازمند جبران"
              : r.final == null
                ? "ناقص"
                : r.passed === true
                  ? "قبول"
                  : "تکمیل";
          if (r.reason) label += " — " + r.reason;
          if (r.policyConfirmed === false) label += " (قواعد پیش‌نویس)";
          return label;
        }

        function refreshPolicyResults() {
          const c = findClass(state.classId);
          if (!c) return;
          for (const el of document.querySelectorAll(
            "[data-pod-final],[data-pod-status]",
          )) {
            const key = el.dataset.podFinal || el.dataset.podStatus,
              [pid, sid] = key.split("|");
            const l = c.lessons.find((l) =>
                l.poudmans.some((p) => p.id === pid),
              ),
              pod = l?.poudmans.find((p) => p.id === pid);
            if (!l?.gradingPolicy) continue;
            const r = EduPolicy.moduleResult(
              l.gradingPolicy,
              pod.podScores?.[sid],
            );
            el.textContent = el.dataset.podFinal
              ? finalText(r)
              : policyStatus(r);
          }
          for (const el of document.querySelectorAll(
            "[data-course-final],[data-course-mean],[data-course-status]",
          )) {
            const key =
                el.dataset.courseFinal ||
                el.dataset.courseMean ||
                el.dataset.courseStatus,
              [lid, sid] = key.split("|"),
              l = getLessonObj(c, lid);
            if (!l) continue;
            const r = calcV24(c, l, sid);
            el.textContent = el.dataset.courseFinal
              ? finalText(r)
              : el.dataset.courseMean
                ? r.provisionalAverage == null
                  ? "—"
                  : r.provisionalAverage.toFixed(2)
                : policyStatus(r);
          }
        }

        const courseUI = EduCourseUI({
          esc,
          uid,
          asciiDigits,
          findClass,
          getDB: () => db,
          state: () => state,
          year: () => db.settings.academicYear,
          assertWritable: () => {
            if (fileMode || workspace?.closed || blocked || !ready)
              throw Error("دوره فعلی قابل ویرایش نیست.");
          },
          flushDrafts,
          saveDB: saveDBV24,
          showModal: showModalV24,
          closeModal: () => closeModal(),
          render: () => render(),
          error: handleError,
          students: getSortedStudents,
          knownStudents,
          calc: calcV24,
          gradeCell,
          finalText,
          status: policyStatus,
        });

        installGlobals();
        if (!globalThis.__EDU_TEST_MODE__ && !globalThis.__EDU_UNIT_TEST__)
          delete window.EduV24.test;
        if (!globalThis.__EDU_UNIT_TEST__) {
          installUI();
          bootstrapV24();
        }
      })();
    </script>
    <script>
      if (location.protocol !== "file:") {
        const manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = "./app.webmanifest";
        document.head.append(manifest);
      }
    </script>
    <script>
      (function () {
        "use strict";
        let pending = false;
        function enhance() {
          pending = false;
          for (const table of document.querySelectorAll(
            "#app table,#modalBody table",
          )) {
            if (!table.dataset.responsiveSized) {
              const columns = Math.max(
                1,
                ...[...table.rows]
                  .slice(0, 3)
                  .map((row) =>
                    [...row.cells].reduce((n, cell) => n + cell.colSpan, 0),
                  ),
              );
              table.style.minWidth =
                (columns >= 4 ? columns * 120 : Math.min(380, columns * 140)) +
                "px";
              table.dataset.responsiveSized = "1";
            }
          }
          for (const container of document.querySelectorAll(".table-scroll")) {
            if (!container.hasAttribute("tabindex")) {
              container.tabIndex = 0;
              container.setAttribute("role", "region");
              container.setAttribute("aria-label", "جدول با پیمایش افقی");
            }
          }
          for (const table of document.querySelectorAll(
            "#app table,#modalBody table",
          )) {
            if (table.closest(".responsive-scroll,.table-scroll")) continue;
            const wrap = document.createElement("div");
            wrap.className = "responsive-scroll";
            wrap.tabIndex = 0;
            wrap.setAttribute("role", "region");
            wrap.setAttribute(
              "aria-label",
              "جدول؛ برای دیدن ستون‌های دیگر افقی پیمایش کنید",
            );
            table.before(wrap);
            wrap.append(table);
          }
          for (const grid of document.querySelectorAll("#app .schedule-grid")) {
            if (grid.parentElement.classList.contains("responsive-scroll"))
              continue;
            const wrap = document.createElement("div");
            wrap.className = "responsive-scroll";
            wrap.tabIndex = 0;
            wrap.setAttribute("role", "region");
            wrap.setAttribute("aria-label", "برنامه هفتگی با پیمایش افقی");
            grid.before(wrap);
            wrap.append(grid);
          }
          const bar = document.querySelector(".workspace-bar");
          if (bar && !bar.querySelector(".workspace-tools")) {
            const tools = document.createElement("details");
            tools.className = "workspace-tools no-print";
            tools.innerHTML =
              '<summary>مدیریت و پشتیبان‌ها</summary><div class="tool-actions"></div>';
            const box = tools.querySelector(".tool-actions");
            for (const button of [...bar.querySelectorAll("button")])
              box.append(button);
            for (const small of [...bar.querySelectorAll("small")])
              box.append(small);
            const backup = document.createElement("button");
            backup.className = "ghost";
            backup.textContent = "ذخیره پشتیبان";
            backup.onclick = () =>
              exportBackup().catch((e) => alert(e.message));
            bar.append(backup, tools);
          }
          const topbar = document.querySelector(".topbar"),
            actions = topbar?.querySelector(".actions");
          if (actions && !topbar.querySelector(".navigation-menu")) {
            const menu = document.createElement("details");
            menu.className = "navigation-menu no-print";
            menu.open = innerWidth > 700;
            menu.innerHTML = "<summary>فهرست برنامه</summary>";
            actions.before(menu);
            menu.append(actions);
            const settings = actions.querySelector(
              'button[onclick="openSettingsModal()"]',
            );
            if (settings) {
              settings.setAttribute("aria-label", "تنظیمات برنامه");
              settings.title = "تنظیمات برنامه";
            }
          }
        }
        function schedule() {
          if (!pending) {
            pending = true;
            requestAnimationFrame(enhance);
          }
        }
        let wideLayout;
        function viewport() {
          document.documentElement.style.setProperty(
            "--app-viewport",
            (window.visualViewport?.height || innerHeight) + "px",
          );
          const wide = innerWidth > 700;
          if (wide !== wideLayout) {
            wideLayout = wide;
            for (const menu of document.querySelectorAll(".navigation-menu"))
              menu.open = wide;
          }
        }
        function start() {
          for (const el of [
            document.getElementById("app"),
            document.getElementById("modalBody"),
          ])
            if (el)
              new MutationObserver(schedule).observe(el, {
                childList: true,
                subtree: true,
              });
          enhance();
          viewport();
          window.visualViewport?.addEventListener("resize", viewport);
          window.addEventListener("resize", viewport);
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", start);
        else start();
      })();
    </script>
    <script>
      (function () {
        "use strict";
        let registration,
          installEvent,
          pendingUpdate = false,
          offlineReady = false;
        function text(message) {
          const el = document.getElementById("mobileStatus");
          if (el) el.textContent = message;
        }
        function paint() {
          const status = offlineReady
            ? navigator.onLine
              ? "آماده اجرای آفلاین"
              : "آفلاین — اطلاعات روی دستگاه ذخیره می‌شود"
            : "در حال آماده‌سازی اجرای آفلاین…";
          text(status);
          document.getElementById("mobileInstall").hidden = !installEvent;
          document.getElementById("mobileUpdate").hidden =
            !registration?.waiting;
        }
        function shell() {
          const bar = document.createElement("aside");
          bar.className = "mobile-bar no-print";
          bar.id = "mobileBar";
          bar.innerHTML =
            '<strong>مدیریت کلاس</strong><span id="mobileStatus" role="status" aria-live="polite"></span><button id="mobileInstall" hidden>نصب برنامه</button><button id="mobileUpdate" hidden>نسخه جدید آماده است</button><button id="mobileHelp" class="ghost">نصب و راهنما</button>';
          document.body.prepend(bar);
          document.getElementById("mobileInstall").onclick = async () => {
            if (!installEvent) return;
            const event = installEvent;
            installEvent = null;
            await event.prompt();
            await event.userChoice;
            paint();
          };
          document.getElementById("mobileUpdate").onclick = update;
          document.getElementById("mobileHelp").onclick = help;
        }
        function help() {
          const installed =
            matchMedia("(display-mode: standalone)").matches ||
            navigator.standalone;
          const html =
            "<p>" +
            (installed
              ? "برنامه از آیکن نصب‌شده اجرا شده است."
              : "در اندروید و رایانه از گزینه «نصب برنامه» مرورگر استفاده کنید. در آیفون و آیپد از اشتراک‌گذاری و «افزودن به صفحه اصلی» استفاده کنید.") +
            "</p><p>دریافت اولیه و به‌روزرسانی به اینترنت نیاز دارد. بعد از نمایش «آماده اجرای آفلاین»، برنامه بدون اینترنت باز می‌شود. یک بار از آیکن نصب‌شده باز کنید و آماده‌بودن را بررسی کنید.</p><p>اطلاعات هر دستگاه و مرورگر جداست. برای انتقال اطلاعات، از داده‌ها «پشتیبان» بگیرید و فایل را در دستگاه دیگر بازیابی کنید. پاک‌کردن داده‌های مرورگر یا حذف برنامه ممکن است اطلاعات این دستگاه را پاک کند؛ فایل مستقل را نگه دارید.</p><p>این برنامه همگام‌سازی خودکار بین دستگاه‌ها ندارد.</p>";
          if (window.showModal) showModal("نصب و استفاده آفلاین", html);
          else
            alert(
              "پس از نمایش آماده اجرای آفلاین، برنامه را از منوی مرورگر روی صفحه اصلی نصب کنید.",
            );
        }
        async function status() {
          const worker =
            navigator.serviceWorker.controller || registration?.active;
          if (!worker) return;
          const channel = new MessageChannel();
          channel.port1.onmessage = (e) => {
            offlineReady = e.data?.ready === true;
            paint();
            channel.port1.close();
          };
          worker.postMessage({ type: "OFFLINE_STATUS" }, [channel.port2]);
        }
        async function update() {
          if (!registration?.waiting || pendingUpdate) return;
          try {
            await window.EduV24?.flushDrafts({ strict: true });
            if (
              !confirm(
                "ویرایش‌های معتبر ذخیره شدند. نسخه جدید برنامه دریافت شده است؛ اکنون برنامه باز شود؟",
              )
            )
              return;
            pendingUpdate = true;
            document.getElementById("mobileUpdate").disabled = true;
            text("در حال اعمال نسخه جدید…");
            registration.waiting.postMessage({ type: "APPLY_UPDATE" });
          } catch (e) {
            text(e.message || "ابتدا ویرایش‌های ذخیره‌نشده را بررسی کنید.");
          }
        }
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          installEvent = e;
          paint();
        });
        window.addEventListener("appinstalled", () => {
          installEvent = null;
          paint();
        });
        window.addEventListener("online", paint);
        window.addEventListener("offline", paint);
        window.addEventListener("load", async () => {
          shell();
          if (location.protocol === "file:") {
            text(
              "فایل مستقل آفلاین؛ نصب استاندارد PWA از لینک امن انجام می‌شود.",
            );
            return;
          }
          if (!("serviceWorker" in navigator) || !window.isSecureContext) {
            text("نصب آفلاین به مرورگر جدید و لینک HTTPS نیاز دارد.");
            return;
          }
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (pendingUpdate) location.reload();
            else status();
          });
          navigator.serviceWorker.addEventListener("message", (e) => {
            if (e.data?.type === "UPDATE_BLOCKED") {
              pendingUpdate = false;
              document.getElementById("mobileUpdate").disabled = false;
              text(
                "برای به‌روزرسانی، تب‌ها و پنجره‌های دیگر همین برنامه را ببندید.",
              );
            }
          });
          try {
            registration = await navigator.serviceWorker.register(
              "./service-worker.js",
              { updateViaCache: "none" },
            );
            registration.addEventListener("updatefound", () => {
              const w = registration.installing;
              w?.addEventListener("statechange", () => {
                if (w.state === "installed") {
                  paint();
                  status();
                }
              });
            });
            await navigator.serviceWorker.ready;
            await status();
            paint();
          } catch (e) {
            text(
              "آماده‌سازی آفلاین کامل نشد؛ اینترنت را بررسی و برنامه را دوباره باز کنید.",
            );
          }
        });
        window.EduPWA = {
          getStatus: () => ({
            offlineReady,
            waiting: !!registration?.waiting,
            installed:
              matchMedia("(display-mode: standalone)").matches ||
              !!navigator.standalone,
          }),
          help,
        };
      })();
    </script>
  </body>
