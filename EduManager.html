              " | " +
              esc(policy.circularDate) +
              " | " +
              esc(policy.reference) +
              "</p><p>حضور و امتیازهای جلسه به نمره رسمی اضافه نمی‌شوند.</p>";
            if (!policy.confirmed)
              h +=
                '<p class="course-warning">نتایج براساس قواعد پیش‌نویس هستند؛ پیش از بستن کارنامه، قواعد را با ابلاغیه تطبیق دهید.</p>';
            if (policy.method === "dual") {
              h +=
                '<div class="table-scroll"><table><thead><tr><th>هنرجو</th><th>عملی</th><th>نظری</th><th>نهایی</th><th>نتیجه و دلیل</th></tr></thead><tbody>';
              for (const st of students) {
                const r = api.calc(c, l, st.id);
                h +=
                  "<tr><td>" +
                  esc(st.name) +
                  "</td><td>" +
                  (editable
                    ? api.gradeCell(c, l, st, "practical", {
                        value: r.practical,
                      })
                    : (r.practical ?? "—")) +
                  "</td><td>" +
                  (editable
                    ? api.gradeCell(c, l, st, "theory", { value: r.theory })
                    : (r.theory ?? "—")) +
                  '</td><td data-kfinal="' +
                  st.id +
                  '">' +
                  api.finalText(r) +
                  '</td><td data-kstatus="' +
                  st.id +
                  '">' +
                  esc(api.status(r)) +
                  "</td></tr>";
              }
              return h + "</tbody></table></div></div>";
            }
            for (const pod of l.poudmans) {
              h +=
                "<h4>" +
                esc(pod.name) +
                "</h4><p>" +
                pod.units.map((u) => esc(u.name)).join(" / ") +
                '</p><div class="table-scroll"><table><thead><tr><th>هنرجو</th><th>مستمر از ' +
                policy.mostamarMax +
                "</th><th>شایستگی ۱ / ۲ / ۳</th>" +
                (policy.requireGate ? "<th>معیارهای الزامی و ایمنی</th>" : "") +
                "<th>نمره پودمان</th><th>نتیجه و دلیل</th></tr></thead><tbody>";
              for (const st of students) {
                const g = pod.podScores?.[st.id] || {},
                  r = P.moduleResult(policy, g);
                h +=
                  `<tr><td>${esc(st.name)}</td><td>` +
                  (editable
                    ? api.gradeCell(c, l, st, "m", {
                        kind: "pod",
                        pid: pod.id,
                        value: g.m,
                      })
                    : (g.m ?? "—")) +
                  "</td><td>" +
                  (editable
                    ? api.gradeCell(c, l, st, "c", {
                        kind: "pod",
                        pid: pod.id,
                        value: g.c,
                      })
                    : (g.c ?? "—")) +
                  "</td>";
                if (policy.requireGate)
                  h +=
                    "<td>" +
                    (editable
                      ? `<select aria-label="معیارهای الزامی ${esc(st.name)}" data-course-gate onchange="EduV24.course.gate('${l.id}','${pod.id}','${st.id}',this.value).catch(EduV24.course.error)"><option value="" ${g.gate == null ? "selected" : ""}>بررسی نشده</option><option value="yes" ${g.gate === true ? "selected" : ""}>احراز شده</option><option value="no" ${g.gate === false ? "selected" : ""}>احراز نشده</option></select>`
                      : g.gate === true
                        ? "احراز شده"
                        : g.gate === false
                          ? "احراز نشده"
                          : "بررسی نشده") +
                    "</td>";
                h += `<td data-pod-final="${pod.id}|${st.id}">${api.finalText(r)}</td><td data-pod-status="${pod.id}|${st.id}">${esc(api.status(r))}</td></tr>`;
              }
              h += "</tbody></table></div>";
            }
            h +=
              "<h4>نتیجه درس</h4><table><thead><tr><th>هنرجو</th><th>نهایی قابل ثبت</th><th>میانگین محاسباتی</th><th>وضعیت</th></tr></thead><tbody>";
            for (const st of students) {
              const r = api.calc(c, l, st.id);
              h += `<tr><td>${esc(st.name)}</td><td data-course-final="${l.id}|${st.id}">${api.finalText(r)}</td><td data-course-mean="${l.id}|${st.id}">${r.provisionalAverage == null ? "—" : r.provisionalAverage.toFixed(2)}</td><td data-course-status="${l.id}|${st.id}">${esc(api.status(r))}</td></tr>`;
            }
            return h + "</tbody></table></div>";
          }
          return { open, save, add, copy, gate, table, toggleMethod, error };
        };
      })(globalThis);
    </script>
    <script>
      (function () {
        "use strict";
        const fileMode =
          typeof location !== "undefined" &&
          location.protocol === "file:" &&
          !globalThis.__EDU_SINGLE_FILE__;
        const old = {
          defaultDB,
          validateDB,
          render,
          calcStudentLesson,
          clickMasterCell,
          showModal,
          checkPassword,
          buildLessonGradesHtml,
          renderLessonStudents,
          buildLessonReportHtml,
        };
        let connection,
          workspace,
          ready = false,
          blocked = false,
          busy = 0,
          writer = Promise.resolve(),
          committed = new Map(),
          draftTimer,
          flushing = null,
          draftRecoveryFailed = false,
          pendingImport = null,
          pendingCSV = null,
          failNextWrite = false;
        let draftGeneration = 0;
        let tabId,
          tabClaimed = false,
          collision = false;
        const documentToken = uid();
        try {
          tabId = sessionStorage.getItem("Edu24.tabId") || uid();
        } catch (ignore) {
          tabId = uid();
        }
        const drafts = new Map();
        let status = { message: "در حال آماده‌سازی…", type: "pending" };
        const channel =
          typeof BroadcastChannel === "function"
            ? new BroadcastChannel("EduManager24")
            : null;
        function currentYearLabel() {
          const parts = new Intl.DateTimeFormat("en-u-ca-persian", {
            year: "numeric",
            month: "numeric",
          }).formatToParts(new Date());
          const y = Number(parts.find((x) => x.type === "year").value),
            m = Number(parts.find((x) => x.type === "month").value);
          const start = m >= 7 ? y : y - 1;
          return start + "-" + (start + 1);
        }

        function v24DefaultDB() {
          const d = old.defaultDB();
          d.schemaVersion = 25;
          d.settings.academicYear = currentYearLabel();
          d.settings.academicTerm = "اول";
          return d;
        }

        function clone(value) {
          return structuredClone(value);
        }

        function asciiDigits(value) {
          return String(value ?? "")
            .replace(/[۰-۹]/g, (c) => String(c.charCodeAt(0) - 1776))
            .replace(/[٠-٩]/g, (c) => String(c.charCodeAt(0) - 1632))
            .replace(/[٫،]/g, ".")
            .trim();
        }

        function parseGrade(value) {
          const text = asciiDigits(value);
          if (text === "")
            return {
              ok: false,
              empty: true,
              message: "برای حذف نمره از دکمه پاک‌کردن استفاده کنید.",
            };
          if (!/^(?:\d{1,2}(?:\.\d{1,6})?|\.\d{1,6})$/.test(text))
            return {
              ok: false,
              message: "عدد صفر تا بیست، با حداکثر شش رقم اعشار وارد کنید.",
            };
          const number = Number(text);
          return number >= 0 && number <= 20
            ? { ok: true, value: number }
            : { ok: false, message: "نمره باید بین صفر و بیست باشد." };
        }

        function fraction(value) {
          const text = String(value).toLowerCase();
          const [mantissa, exp = "0"] = text.split("e");
          const negative = mantissa.startsWith("-"),
            clean = mantissa.replace("-", ""),
            [whole, dec = ""] = clean.split(".");
          let n = BigInt(whole + dec) * (negative ? -1n : 1n),
            scale = dec.length - Number(exp);
          return scale >= 0
            ? { n, d: 10n ** BigInt(scale) }
            : { n: n * 10n ** BigInt(-scale), d: 1n };
        }

        function weightedKardanesh(practical, theory) {
          if (practical == null || theory == null)
            return { final: null, passed: null };
          const a = fraction(practical),
            b = fraction(theory),
            n = 7n * a.n * b.d + 3n * b.n * a.d,
            d = 10n * a.d * b.d;
          return { final: Number(n) / Number(d), passed: n >= 14n * d };
        }

        function finalText(result) {
          if (result.final == null) return "—";
          const text = result.final.toFixed(2);
          if (
            result.threshold != null &&
            result.final < result.threshold &&
            Number(text) >= result.threshold
          )
            return String(result.final) + " (کمتر از " + result.threshold + ")";
          return result.passed === false &&
            result.final < 14 &&
            text === "14.00"
            ? String(result.final) + " (کمتر از ۱۴)"
            : text;
        }

        function knownStudents(c) {
          return [...c.students, ...(c.archivedStudents || [])];
        }

        function validateV24(d) {
          if (
            d.schemaVersion !== undefined &&
            (!Number.isInteger(d.schemaVersion) ||
              d.schemaVersion > 25 ||
              d.schemaVersion < 22)
          )
            throw Error("نسخه ساختار داده پشتیبانی نمی‌شود.");
          old.validateDB(d);
          if (
            d.settings?.academicYear !== undefined &&
            (typeof d.settings.academicYear !== "string" ||
              d.settings.academicYear.length > 40)
          )
            throw Error("سال تحصیلی معتبر نیست.");
          if (
            d.settings?.academicTerm !== undefined &&
            (typeof d.settings.academicTerm !== "string" ||
              d.settings.academicTerm.length > 60)
          )
            throw Error("نوبت تحصیلی معتبر نیست.");
          const classes = new Map();
          for (const s of d.schools)
            for (const c of s.classes) {
              classes.set(c.id, c);
              const ids = new Set(knownStudents(c).map((st) => st.id)),
                codes = new Set();
              for (const st of knownStudents(c)) {
                if (st.code !== undefined && typeof st.code !== "string")
                  throw Error("کد دانش‌آموز نامعتبر است.");
                if (st.code) {
                  if (codes.has(st.code))
                    throw Error("کد دانش‌آموز در کلاس تکراری است.");
                  codes.add(st.code);
                }
              }
              for (const l of c.lessons || []) {
                validateCourse(l, ids, d.settings?.academicYear);
                for (const id of Object.keys(l.kardaneshScores || {}))
                  if (!ids.has(id))
                    throw Error("نمره متعلق به دانش‌آموز ناموجود است: " + id);
                for (const p of l.poudmans)
                  for (const u of p.units)
                    for (const id of Object.keys(u.unitScores || {}))
                      if (!ids.has(id))
                        throw Error(
                          "نمره واحد متعلق به دانش‌آموز ناموجود است: " + id,
                        );
              }
            }
          for (const x of d.sessions) {
            const c = classes.get(x.classId),
              known = new Set(knownStudents(c).map((st) => st.id));
            const roster = x.roster || [];
            for (const st of roster)
              if (!known.has(st.id))
                throw Error("عضو جلسه در سوابق کلاس وجود ندارد.");
            const members = new Set(roster.map((st) => st.id));
            for (const id of [
              ...Object.keys(x.attendance),
              ...x.scores.map((sc) => sc.studentId),
            ])
              if (!known.has(id) || !members.has(id))
                throw Error("حضور یا نمره خارج از فهرست تاریخی جلسه است.");
          }
          return true;
        }

        function normalizeDB(input, { legacy = false } = {}) {
          if (input?.schemaVersion > 25)
            throw Error("این بانک متعلق به نسخه جدیدتر برنامه است.");
          const d = clone(input);
          const defaults = v24DefaultDB();
          d.settings = Object.assign(defaults.settings, d.settings || {});
          d.masterSchedule = d.masterSchedule || {};
          d.sessions = d.sessions || [];
          d.activeDays = d.activeDays || defaults.activeDays;
          d.periods = d.periods ?? 6;
          const warnings = [...(d.migrationWarnings || [])];
          for (const school of d.schools || [])
            for (const c of school.classes || []) {
              c.archivedStudents = c.archivedStudents || [];
              c.lessons = c.lessons || [];
              const all = new Map(knownStudents(c).map((st) => [st.id, st]));
              for (const st of all.values())
                if (st.code) st.code = asciiDigits(st.code);
              const references = new Set();
              for (const l of c.lessons) {
                l.gradeMode = l.gradeMode || "standard";
                l.kardaneshScores = l.kardaneshScores || {};
                l.weightMostamar = l.weightMostamar ?? 40;
                l.weightPayani = l.weightPayani ?? 60;
                for (const id of Object.keys(l.kardaneshScores))
                  references.add(id);
                for (const p of l.poudmans || [])
                  for (const u of p.units || []) {
                    u.unitScores = u.unitScores || {};
                    u.applyOptions = Object.assign(
                      {
                        pos: false,
                        neg: false,
                        hw: false,
                        present: false,
                        late: false,
                      },
                      u.applyOptions || {},
                    );
                    for (const id of Object.keys(u.unitScores))
                      references.add(id);
                  }
                for (const g of Object.values(l.kardaneshScores))
                  Object.assign(
                    g,
                    l.gradingPolicy?.method === "dual"
                      ? EduPolicy.dual(l.gradingPolicy, g.practical, g.theory)
                      : weightedKardanesh(g.practical, g.theory),
                  );
              }
              for (const x of d.sessions.filter((x) => x.classId === c.id)) {
                for (const st of x.roster || []) references.add(st.id);
                for (const id of Object.keys(x.attendance || {}))
                  references.add(id);
                for (const sc of x.scores || []) references.add(sc.studentId);
              }
              if (legacy)
                for (const id of references)
                  if (!all.has(id)) {
                    const st = {
                      id,
                      name: "دانش‌آموز بازیابی‌شده (" + id + ")",
                      recovered: true,
                    };
                    c.archivedStudents.push(st);
                    all.set(id, st);
                    warnings.push(
                      "نام دانش‌آموز " +
                        id +
                        " در " +
                        c.name +
                        " نیازمند بررسی است.",
                    );
                  }
              for (const x of d.sessions.filter((x) => x.classId === c.id)) {
                if (!x.roster) {
                  const recorded = new Set([
                    ...Object.keys(x.attendance || {}),
                    ...(x.scores || []).map((sc) => sc.studentId),
                  ]);
                  x.roster = recorded.size
                    ? [...recorded].map((id) =>
                        clone(all.get(id) || { id, name: id }),
                      )
                    : c.students.map((st) => ({ id: st.id, name: st.name }));
                } else if (legacy) {
                  const members = new Set(x.roster.map((st) => st.id));
                  for (const id of [
                    ...Object.keys(x.attendance || {}),
                    ...(x.scores || []).map((sc) => sc.studentId),
                  ])
                    if (!members.has(id) && all.has(id)) {
                      x.roster.push(clone(all.get(id)));
                      members.add(id);
                    }
                }
              }
            }
          d.schemaVersion = 25;
          d.migrationWarnings = [...new Set(warnings)];
          validateV24(d);
          return d;
        }

        function requestPromise(request) {
          return new Promise((resolve, reject) => {
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        }

        function transactionDone(tx) {
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve();
            tx.onabort = () => reject(tx.error || Error("تراکنش لغو شد."));
            tx.onerror = () => {};
          });
        }

        async function openDatabase() {
          if (!globalThis.indexedDB)
            throw Error(
              "این مرورگر IndexedDB را در اختیار برنامه قرار نمی‌دهد.",
            );
          return new Promise((resolve, reject) => {
            const request = indexedDB.open("EduManagerProfessional", 1);
            request.onupgradeneeded = () => {
              const connection = request.result;
              connection.createObjectStore("records", { keyPath: "key" });
              connection.createObjectStore("catalog", { keyPath: "id" });
              const history = connection.createObjectStore("events", {
                keyPath: "id",
                autoIncrement: true,
              });
              history.createIndex("workspace", "workspace");
              connection.createObjectStore("backups", { keyPath: "id" });
              connection.createObjectStore("undo", { keyPath: "id" });
              connection.createObjectStore("reports", { keyPath: "id" });
            };
            request.onsuccess = () => {
              const connection = request.result;
              connection.onversionchange = () => {
                connection.close();
                blocked = true;
                setStatus(
                  "برنامه در تب دیگر ارتقا یافت؛ صفحه را دوباره بارگذاری کنید.",
                  "error",
                );
              };
              resolve(connection);
            };
            request.onerror = () => reject(request.error);
            request.onblocked = () =>
              reject(
                Error("تب قدیمی برنامه را ببندید و دوباره بارگذاری کنید."),
              );
          });
        }

        async function allFrom(store) {
          const tx = connection.transaction(store, "readonly");
          return requestPromise(tx.objectStore(store).getAll());
        }

        async function readRecord(store, key) {
          const tx = connection.transaction(store, "readonly");
          return requestPromise(tx.objectStore(store).get(key));
        }

        function recordKey(key) {
          return workspace.id + "|" + key;
        }

        function metaValue(d) {
          const { schools, sessions, ...meta } = d;
          return {
            ...meta,
            layout: schools.map((s) => ({
              id: s.id,
              name: s.name,
              classes: s.classes.map((c) => c.id),
            })),
          };
        }

        function collectRecords(d, scope = {}) {
          const output = new Map([["meta", metaValue(d)]]);
          for (const s of d.schools)
            for (const c of s.classes)
              if (
                (!scope.classId && !scope.sessionId) ||
                scope.classId === c.id
              )
                output.set("class:" + c.id, clone(c));
          for (const x of d.sessions)
            if (
              (!scope.classId && !scope.sessionId) ||
              scope.sessionId === x.id
            )
              output.set("session:" + x.id, clone(x));
          return output;
        }

        async function readWorkspace(id) {
          const records = (await allFrom("records")).filter(
              (x) => x.workspace === id,
            ),
            meta = records.find((x) => x.logical === "meta");
          if (!meta) throw Error("داده دوره موجود نیست.");
          const value = clone(meta.value),
            layout = value.layout;
          delete value.layout;
          const byKey = new Map(records.map((x) => [x.logical, x.value]));
          value.schools = layout.map((s) => ({
            id: s.id,
            name: s.name,
            classes: s.classes.map((id) => clone(byKey.get("class:" + id))),
          }));
          value.sessions = records
            .filter((x) => x.logical.startsWith("session:"))
            .map((x) => clone(x.value));
          return {
            data: normalizeDB(value),
            records: new Map(
              records.map((x) => [x.logical, JSON.stringify(x.value)]),
            ),
          };
        }

        function deriveClass(c) {
          for (const l of c.lessons)
            for (const g of Object.values(l.kardaneshScores || {}))
              Object.assign(
                g,
                l.gradingPolicy?.method === "dual"
                  ? EduPolicy.dual(l.gradingPolicy, g.practical, g.theory)
                  : weightedKardanesh(g.practical, g.theory),
              );
        }

        function checkScope(scope) {
          if (!scope.classId && !scope.sessionId) {
            for (const school of db.schools)
              for (const c of school.classes) deriveClass(c);
            validateV24(db);
            return;
          }
          const classId =
            scope.classId ||
            db.sessions.find((x) => x.id === scope.sessionId)?.classId;
          let school, selected;
          for (const s of db.schools) {
            const c = s.classes.find((c) => c.id === classId);
            if (c) {
              school = s;
              selected = c;
              break;
            }
          }
          if (!selected) throw Error("رکورد مقصد وجود ندارد.");
          deriveClass(selected);
          const tiny = {
            ...db,
            schools: [
              { id: school.id, name: school.name, classes: [selected] },
            ],
            masterSchedule: {},
            sessions: scope.sessionId
              ? db.sessions.filter((x) => x.id === scope.sessionId)
              : [],
          };
          validateV24(tiny);
        }

        function changesBetween(before, after, path = "", result = []) {
          if (JSON.stringify(before) === JSON.stringify(after)) return result;
          const a = before && typeof before === "object",
            b = after && typeof after === "object";
          if (a && b && Array.isArray(before) === Array.isArray(after)) {
            for (const key of new Set([
              ...Object.keys(before),
              ...Object.keys(after),
            ]))
              changesBetween(
                before[key],
                after[key],
                path ? path + "." + key : key,
                result,
              );
          } else
            result.push({
              path,
              before: path.endsWith(".password")
                ? before
                  ? "رمز تنظیم‌شده"
                  : "بدون رمز"
                : before === undefined
                  ? null
                  : before,
              after: path.endsWith(".password")
                ? after
                  ? "رمز تنظیم‌شده"
                  : "بدون رمز"
                : after === undefined
                  ? null
                  : after,
            });
          return result;
        }

        async function commitRecords(
          records,
          {
            action = "ویرایش اطلاعات",
            replace = false,
            allowClosed = false,
            keepUndo = true,
          } = {},
        ) {
          if (blocked)
            throw Error("ذخیره مسدود است؛ صفحه را دوباره بارگذاری کنید.");
          if (workspace.closed && !allowClosed)
            throw Error("این دوره بسته است؛ ابتدا آن را بازگشایی کنید.");
          const values = new Map(
            [...records].map(([key, value]) => [key, JSON.stringify(value)]),
          );
          const changed = [...values].filter(
            ([key, value]) => committed.get(key) !== value,
          );
          const removed = replace
            ? [...committed.keys()].filter((key) => !values.has(key))
            : [];
          if (!changed.length && !removed.length) return;
          const before = [
            ...changed.map(([key]) => ({
              key,
              value: committed.has(key) ? JSON.parse(committed.get(key)) : null,
            })),
            ...removed.map((key) => ({
              key,
              value: JSON.parse(committed.get(key)),
            })),
          ];
          const changes = [];
          for (const [key, json] of changed)
            changesBetween(
              committed.has(key) ? JSON.parse(committed.get(key)) : null,
              JSON.parse(json),
              key,
              changes,
            );
          for (const key of removed)
            changes.push({
              path: key,
              before: JSON.parse(committed.get(key)),
              after: null,
            });
          if (failNextWrite) {
            failNextWrite = false;
            throw new DOMException("آزمون شکست ذخیره", "QuotaExceededError");
          }
          const tx = connection.transaction(
              ["records", "catalog", "events", "undo"],
              "readwrite",
            ),
            done = transactionDone(tx);
          let conflict = false,
            nextCatalog;
          const catalog = tx.objectStore("catalog"),
            get = catalog.get(workspace.id);
          get.onsuccess = () => {
            const live = get.result;
            if (!live || live.revision !== workspace.revision) {
              conflict = true;
              tx.abort();
              return;
            }
            for (const [logical, json] of changed)
              tx.objectStore("records").put({
                key: recordKey(logical),
                workspace: workspace.id,
                logical,
                value: JSON.parse(json),
              });
            for (const logical of removed)
              tx.objectStore("records").delete(recordKey(logical));
            const next = {
              ...live,
              year: records.get("meta")?.settings?.academicYear ?? live.year,
              term: records.get("meta")?.settings?.academicTerm ?? live.term,
              revision: live.revision + 1,
              updatedAt: new Date().toISOString(),
            };
            nextCatalog = next;
            catalog.put(next);
            tx.objectStore("events").add({
              workspace: workspace.id,
              at: next.updatedAt,
              action,
              revision: next.revision,
              changes,
            });
            if (keepUndo)
              tx.objectStore("undo").put({
                id: workspace.id,
                action,
                revision: next.revision,
                before,
              });
            else tx.objectStore("undo").delete(workspace.id);
          };
          try {
            await done;
          } catch (e) {
            if (conflict) {
              blocked = true;
              throw Error(
                "داده در تب دیگری تغییر کرده است؛ برای جلوگیری از بازنویسی، صفحه را دوباره بارگذاری کنید.",
              );
            }
            throw e;
          }
          for (const [key, json] of changed) committed.set(key, json);
          for (const key of removed) committed.delete(key);
          workspace = nextCatalog;
          broadcast({
            workspace: workspace.id,
            revision: workspace.revision,
          });
          return true;
        }

        function saveDBV24(scope = {}) {
          if (fileMode)
            return Promise.reject(
              Error(
                "برای ویرایش پایدار، Start-EduManager.cmd را اجرا کنید. حالت فایل فقط برای انتقال سوابق است.",
              ),
            );
          busy++;
          paintStatus();
          const operation = writer
            .catch(() => {})
            .then(async () => {
              checkScope(scope);
              await commitRecords(collectRecords(db, scope), {
                ...scope,
                replace: !scope.classId && !scope.sessionId,
              });
              storageBlocked = false;
              storageProblem = "";
              setStatus("تغییرات ذخیره شد.", "saved");
            })
            .catch(async (error) => {
              try {
                db = (await readWorkspace(workspace.id)).data;
              } catch (ignore) {}
              setStatus("تغییر ذخیره نشد: " + error.message, "error");
              render();
              throw error;
            })
            .finally(() => {
              busy--;
              paintStatus();
            });
          writer = operation;
          return operation;
        }

        async function installWorkspace(data, details) {
          const id = details.id || uid(),
            now = new Date().toISOString(),
            catalog = {
              id,
              year: details.year || data.settings.academicYear,
              term: details.term || data.settings.academicTerm || "نامشخص",
              revision: 1,
              closed: false,
              createdAt: now,
              updatedAt: now,
            };
          const records = collectRecords(data);
          const tx = connection.transaction(
              ["records", "catalog"],
              "readwrite",
            ),
            done = transactionDone(tx);
          tx.objectStore("catalog").put(catalog);
          for (const [logical, value] of records)
            tx.objectStore("records").put({
              key: id + "|" + logical,
              workspace: id,
              logical,
              value,
            });
          await done;
          return catalog;
        }

        async function bootstrapV24() {
          document.getElementById("app").innerHTML =
            '<div class="card" role="status">در حال خواندن امن اطلاعات…</div>';
          try {
            await claimTab();
            connection = await openDatabase();
            let periods = await allFrom("catalog");
            if (!periods.length) {
              const raw = localStorage.getItem(STORAGE_KEY);
              let data;
              if (raw) {
                const original = JSON.parse(raw);
                data = normalizeDB(original, { legacy: true });
                data.settings.academicTerm =
                  original.settings?.academicTerm || "سوابق پیشین";
                await putBackup(original, "انتقال نسخه قبلی", null);
              } else data = v24DefaultDB();
              const created = await installWorkspace(data, {
                id: "initial",
                year: data.settings.academicYear,
                term: data.settings.academicTerm,
              });
              periods = [created];
              const check = await readWorkspace(created.id);
              if (!check.data) throw Error("بازخوانی انتقال تأیید نشد.");
              if (raw) {
                localStorage.removeItem(STORAGE_KEY);
                storageSnapshot = null;
              }
            }
            const preferred = preferredPeriod();
            workspace =
              periods.find((x) => x.id === preferred) ||
              periods.sort((a, b) => b.createdAt.localeCompare(a.createdAt))[0];
            const loaded = await readWorkspace(workspace.id);
            db = loaded.data;
            committed = loaded.records;
            storageBlocked = false;
            storageProblem = "";
            ready = true;
            try {
              rememberPeriod(workspace.id);
            } catch (ignore) {}
            setStatus("اطلاعات ذخیره‌شده خوانده شد.", "saved");
            loadDrafts();
            render();
            await recoverDrafts();
            if (navigator.storage?.persist)
              navigator.storage.persist().catch(() => {});
            await ensureDailyBackup();
          } catch (error) {
            blocked = true;
            storageBlocked = true;
            storageProblem = error.message;
            document.getElementById("app").innerHTML =
              '<div class="card" role="alert"><h2>خواندن اطلاعات انجام نشد</h2><p>' +
              esc(error.message) +
              '</p><button onclick="downloadRawRecovery()">دریافت نسخه قبلی</button><button onclick="document.getElementById(\'importFile\').click()">بازیابی پشتیبان سالم</button></div>';
          }
        }

        function setStatus(message, type = "saved") {
          status = { message, type };
          paintStatus();
        }

        function paintStatus() {
          const el = document.getElementById("saveStatus");
          if (el) {
            el.textContent = busy ? "در حال ذخیره…" : status.message;
            el.dataset.state = busy ? "pending" : status.type;
          }
          document.querySelectorAll("[data-mutating]").forEach((el) => {
            el.disabled =
              blocked ||
              !!workspace?.closed ||
              fileMode ||
              (busy > 0 && !el.matches("[data-grade]"));
          });
        }

        function inputKey(d) {
          return [
            d.kind,
            d.classId,
            d.lid,
            d.pid || "",
            d.uid || "",
            d.sid,
            d.field,
          ].join("|");
        }

        function draftStorageKey() {
          return draftBaseKey() + "." + documentToken;
        }

        function storeDrafts() {
          try {
            const key = draftStorageKey(),
              raw = JSON.parse(localStorage.getItem(key) || "null");
            if (
              raw &&
              !Array.isArray(raw) &&
              Number(raw.generation) > draftGeneration
            )
              return;
            localStorage.setItem(
              key,
              JSON.stringify({
                owner: documentToken,
                generation: draftGeneration,
                entries: [...drafts.values()],
                updatedAt: new Date().toISOString(),
              }),
            );
            draftRecoveryFailed = false;
          } catch (error) {
            draftRecoveryFailed = true;
            setStatus(
              "پیش‌نویس ثبت نشد؛ تا ذخیره موفق صفحه را نبندید.",
              "error",
            );
          }
        }

        function loadDrafts() {
          drafts.clear();
          try {
            const base = draftBaseKey(),
              records = Object.keys(localStorage)
                .filter((key) => key === base || key.startsWith(base + "."))
                .map((key) => {
                  const raw = JSON.parse(localStorage.getItem(key) || "null");
                  return {
                    key,
                    entries: Array.isArray(raw) ? raw : raw?.entries || [],
                    generation: Array.isArray(raw)
                      ? 0
                      : Number(raw?.generation || 0),
                    updatedAt: raw?.updatedAt || "",
                  };
                });
            for (const r of records)
              if (
                !Array.isArray(r.entries) ||
                !Number.isSafeInteger(r.generation) ||
                r.generation < 0
              )
                throw Error("ساختار پیش‌نویس معتبر نیست.");
            records.sort(
              (a, b) =>
                b.generation - a.generation ||
                b.updatedAt.localeCompare(a.updatedAt),
            );
            const saved = records[0];
            draftGeneration = (saved?.generation || 0) + 1;
            for (const item of saved?.entries || [])
              if (
                item &&
                ["k", "u"].includes(item.kind) &&
                typeof item.value === "string" &&
                item.value.length < 100
              )
                drafts.set(inputKey(item), item);
            storeDrafts();
            if (!draftRecoveryFailed)
              for (const old of records)
                if (old.generation < draftGeneration - 1)
                  localStorage.removeItem(old.key);
          } catch (error) {
            draftRecoveryFailed = true;
            setStatus(
              "پیش‌نویس قبلی خوانده نشد؛ داده اصلی محفوظ است.",
              "error",
            );
          }
        }

        function contextFromInput(input) {
          return {
            kind: input.dataset.kind,
            classId: input.dataset.class,
            lid: input.dataset.lesson,
            sid: input.dataset.student,
            pid: input.dataset.pod,
            uid: input.dataset.unit,
            field: input.dataset.field,
            value: input.value,
            at: new Date().toISOString(),
          };
        }

        function gradeInput(input) {
          const item = contextFromInput(input),
            key = inputKey(item),
            parsed = parseDraft(item);
          item.error = parsed.ok ? "" : parsed.message;
          drafts.set(key, item);
          input.setAttribute("aria-invalid", parsed.ok ? "false" : "true");
          const note = input.parentElement?.querySelector(".grade-note");
          if (note)
            note.textContent = parsed.ok ? "در انتظار ذخیره" : parsed.message;
          storeDrafts();
          setStatus(
            parsed.ok ? "ویرایش در انتظار ذخیره است." : parsed.message,
            parsed.ok ? "pending" : "error",
          );
          clearTimeout(draftTimer);
          if (parsed.ok)
            draftTimer = setTimeout(() => flushDrafts().catch(() => {}), 180);
        }

        function clearGrade(input) {
          const item = contextFromInput(input);
          if (
            !confirm(
              "نمره این بخش پاک شود؟ این تغییر در تاریخچه ثبت و قابل بازگردانی است.",
            )
          )
            return;
          item.value = "";
          item.remove = true;
          item.error = "";
          drafts.set(inputKey(item), item);
          input.value = "";
          storeDrafts();
          flushDrafts().catch(() => {});
        }

        function findClass(id) {
          for (const school of db.schools) {
            const c = school.classes.find((c) => c.id === id);
            if (c) return c;
          }
          return null;
        }

        async function flushDrafts({ strict = false } = {}) {
          clearTimeout(draftTimer);
          if (flushing) {
            await flushing;
            if (strict && drafts.size)
              throw Error("نمره ذخیره‌نشده یا نامعتبر وجود دارد.");
            return;
          }
          const invalid = [...drafts.values()].filter(
            (x) => !x.remove && !parseDraft(x).ok,
          );
          if (strict && [...drafts.values()].some((x) => x.review))
            throw Error("پیش‌نویس تعارض نیازمند بررسی و تأیید است.");
          if (strict && invalid.length)
            throw Error(
              "ابتدا ورودی نامعتبر یا خالی را اصلاح کنید یا با دکمه پاک‌کردن حذف کنید.",
            );
          const entries = [...drafts.entries()].filter(
            ([, x]) => !x.review && (x.remove || parseDraft(x).ok),
          );
          if (!entries.length) return;
          flushing = (async () => {
            const groups = new Map();
            for (const [key, item] of entries) {
              if (!groups.has(item.classId)) groups.set(item.classId, []);
              groups.get(item.classId).push([key, item]);
            }
            for (const [classId, items] of groups) {
              const c = findClass(classId);
              if (!c) throw Error("کلاس پیش‌نویس موجود نیست.");
              for (const [, item] of items) {
                const l = getLessonObj(c, item.lid);
                if (!l || !c.students.some((st) => st.id === item.sid))
                  throw Error("دانش‌آموز یا درس پیش‌نویس فعال نیست.");
                let target;
                if (item.kind === "k") {
                  if (
                    l.gradeMode !== "kardanesh" ||
                    !["practical", "theory"].includes(item.field)
                  )
                    throw Error("نوع نمره معتبر نیست.");
                  target =
                    (l.kardaneshScores || (l.kardaneshScores = {}))[item.sid] ||
                    {};
                  l.kardaneshScores[item.sid] = target;
                } else if (item.kind === "pod") {
                  const pod = l.poudmans.find((p) => p.id === item.pid);
                  if (
                    !pod ||
                    l.gradingPolicy?.method !== "modular" ||
                    !["m", "c"].includes(item.field)
                  )
                    throw Error("پودمان یا نوع نمره نامعتبر است.");
                  pod.podScores = pod.podScores || {};
                  target = pod.podScores[item.sid] || {};
                  pod.podScores[item.sid] = target;
                } else {
                  if (l.gradingPolicy)
                    throw Error("نمرات رسمی را در فرم قواعد درس ثبت کنید.");
                  if (!["m", "p"].includes(item.field))
                    throw Error("نوع نمره واحد نامعتبر است.");
                  const unit = l.poudmans
                    .find((p) => p.id === item.pid)
                    ?.units.find((u) => u.id === item.uid);
                  if (!unit) throw Error("واحد پیش‌نویس موجود نیست.");
                  target =
                    (unit.unitScores || (unit.unitScores = {}))[item.sid] || {};
                  unit.unitScores[item.sid] = target;
                }
                if (item.remove) delete target[item.field];
                else {
                  const parsed = parseDraft(item);
                  if (!parsed.ok) throw Error(parsed.message);
                  target[item.field] = parsed.value;
                }
              }
              await saveDBV24({ classId, action: "ثبت نمره (" + c.name + ")" });
              for (const [key, item] of items)
                if (drafts.get(key) === item) drafts.delete(key);
              storeDrafts();
            }
            if (!drafts.size) setStatus("همه نمرات ذخیره شدند.", "saved");
            else
              setStatus(
                "برخی ورودی‌ها هنوز ذخیره نشده‌اند؛ پیام کنار کادر را بررسی کنید.",
                "error",
              );
            refreshGradeResults();
            if (!document.activeElement?.matches?.("[data-grade]")) render();
          })()
            .catch(async (error) => {
              try {
                db = (await readWorkspace(workspace.id)).data;
              } catch (ignore) {}
              for (const [key] of entries) {
                const item = drafts.get(key);
                if (item) {
                  item.error = "ذخیره نشد: " + error.message;
                  if (blocked) item.review = true;
                }
              }
              storeDrafts();
              setStatus(
                "نمرات ذخیره نشدند؛ پیش‌نویس محفوظ است. " + error.message,
                "error",
              );
              render();
              throw error;
            })
            .finally(() => {
              flushing = null;
            });
          await flushing;
          if (
            drafts.size &&
            [...drafts.values()].some((x) => !x.error && !x.review)
          )
            draftTimer = setTimeout(() => flushDrafts().catch(() => {}), 180);
        }

        async function recoverDrafts() {
          if (!drafts.size) return;
          if ([...drafts.values()].some((x) => x.review)) {
            setStatus(
              "پیش‌نویس تعارض خودکار اعمال نشد؛ دکمه بررسی پیش‌نویس را بزنید.",
              "error",
            );
            applyDrafts();
            return;
          }
          setStatus("پیش‌نویس ویرایش قبلی بازیابی شد.", "pending");
          applyDrafts();
          if (!db.settings.password || isAuthenticated)
            await flushDrafts().catch(() => {});
        }

        function applyDrafts() {
          document.querySelectorAll("[data-grade]").forEach((input) => {
            const item = drafts.get(inputKey(contextFromInput(input)));
            if (item) {
              input.value = item.value;
              input.setAttribute("aria-invalid", item.error ? "true" : "false");
              const note = input.parentElement.querySelector(".grade-note");
              if (note) note.textContent = item.error || "در انتظار ذخیره";
            }
          });

        function calcV24(c, l, sid) {
          const r = old.calcStudentLesson(c, l, sid);
          if (l.gradingPolicy) {
            const p = l.gradingPolicy;
            if (p.method === "dual")
              Object.assign(r, EduPolicy.dual(p, r.practical, r.theory));
            else
              Object.assign(r, EduPolicy.lesson(p, l.poudmans, sid), {
                avgM: null,
                avgP: null,
              });
            r.policyConfirmed = p.confirmed;
          } else if (l.gradeMode === "kardanesh")
            Object.assign(r, weightedKardanesh(r.practical, r.theory));
          return r;
        }

        async function addSessionScoreV24(e, id) {
          e.preventDefault();
          const x = getSessionById(id),
            c = findClass(x.classId),
            l = getLessonObj(c, x.lessonId),
            f = e.target,
            type = f.type.value,
            sid = f.studentId.value;
          if (
            !Object.hasOwn(TYPE_LABELS, type) ||
            !sessionRoster(c, x).some((st) => st.id === sid)
          )
            throw Error("دانش‌آموز یا نوع امتیاز نامعتبر است.");
          let value;
          if (["mostamar", "payani"].includes(type)) {
            if (l.gradingPolicy || l.gradeMode === "kardanesh")
              throw Error("نمرات رسمی را در بخش نمرات درس ثبت کنید.");
            if (!x.poudmanId || !x.unitId)
              throw Error("ابتدا پودمان و واحد را مشخص کنید.");
            const parsed = parseGrade(f.value.value);
            if (!parsed.ok) throw Error(parsed.message);
            value = parsed.value;
            x.scores = x.scores.filter(
              (sc) => sc.studentId !== sid || sc.type !== type,
            );
          } else {
            const text = asciiDigits(f.value.value);
            if (!/^\d+(?:\.\d{1,6})?$/.test(text))
              throw Error("مقدار امتیاز عددی و نامنفی باشد.");
            value = Number(text);
            if (!Number.isFinite(value) || value > 1000)
              throw Error("امتیاز باید صفر تا هزار باشد.");
          }
          x.scores.push({
            studentId: sid,
            type,
            value,
            note: f.note.value.trim(),
            recordedAt: new Date().toISOString(),
          });
          await saveDBV24({
            sessionId: id,
            action: "ثبت یا اصلاح " + TYPE_LABELS[type],
          });
          openSessionModal(getSessionById(id));
        }

        async function putBackup(data, label, workspaceId = workspace?.id) {
          const backup = {
            id: uid(),
            workspace: workspaceId,
            at: new Date().toISOString(),
            label,
            db: clone(data),
          };
          const tx = connection.transaction("backups", "readwrite"),
            done = transactionDone(tx);
          tx.objectStore("backups").put(backup);
          await done;
          const all = (await allFrom("backups"))
            .filter(
              (x) => x.workspace === workspaceId && !x.label.includes("انتقال"),
            )
            .sort((a, b) => b.at.localeCompare(a.at));
          if (all.length > 8) {
            const cleanup = connection.transaction("backups", "readwrite"),
              finished = transactionDone(cleanup);
            all
              .slice(8)
              .forEach((x) => cleanup.objectStore("backups").delete(x.id));
            await finished;
          }
          return backup;
        }

              "error",
            );
          }
          await writer.catch(() => {});
          const durable = (await readWorkspace(workspace.id)).data;
          const content = {
              version: 25,
              exportedAt: new Date().toISOString(),

              period: { year: workspace.year, term: workspace.term },
              db: durable,
            },
            name =
              "مدرسه-" +
              workspace.year +
              "-" +
              workspace.term +
              "-" +
              todayISO() +
              ".json";
          let confirmed = false;
          if (window.showSaveFilePicker) {

              const handle = await window.showSaveFilePicker({
                suggestedName: name,
                types: [
                  {
                    description: "پشتیبان مدرسه",
                    accept: { "application/json": [".json"] },
                  },
                ],
              });
              const writable = await handle.createWritable();
              await writable.write(JSON.stringify(content, null, 2));
              await writable.close();
              confirmed = true;
            } catch (error) {
              if (error.name === "AbortError") return false;
              downloadJSON(content, name);
            }
          } else downloadJSON(content, name);
          try {
            localStorage.setItem(
              "Edu24.externalBackup." + workspace.id,
              JSON.stringify({ date: todayISO(), confirmed }),

          } catch (ignore) {}

        async function handleImportV24(e) {
          const file = e.target.files[0];
          if (!file) return;
          try {
            if (file.size > 100 * 1024 * 1024)
              throw Error("حداکثر حجم فایل پشتیبان صد مگابایت است.");
            const parsed = JSON.parse(await file.text());
            if (
              parsed.version !== undefined &&
              (!Number.isInteger(parsed.version) ||
                parsed.version > 25 ||
                parsed.version < 1)
            )
              throw Error("نسخه پشتیبان پشتیبانی نمی‌شود.");
            const source = parsed.db || parsed;
            if (source.schemaVersion > 25)
              throw Error("نسخه ساختار جدیدتر پشتیبانی نمی‌شود.");
            const candidate = normalizeDB(source, {
              legacy: (source.schemaVersion ?? parsed.version ?? 23) < 24,
            });
            if (!ready) {
              if (!connection) connection = await openDatabase();
              workspace = await installWorkspace(candidate, {
                id: uid(),
                year: candidate.settings.academicYear,
                term: candidate.settings.academicTerm,
              });
              const loaded = await readWorkspace(workspace.id);
              db = loaded.data;
              committed = loaded.records;
              ready = true;
              blocked = false;
              storageBlocked = false;
              isAuthenticated = false;
              rememberPeriod(workspace.id);
              render();
              return;
            }
            await flushDrafts({ strict: true });
            previewImport(candidate, file.name);
          } catch (error) {
            handleError(error);
          } finally {
            e.target.value = "";
          }
        }

        async function confirmImport() {
          if (fileMode)
            throw Error(
              "این عملیات را از راه‌انداز Start-EduManager.cmd انجام دهید.",
            );
          if (!pendingImport || pendingImport.workspace !== workspace.id)
            throw Error("پیش‌نمایش بازیابی منقضی شده است.");
          if (document.getElementById("restoreMode").value === "new") {
            const candidate = normalizeDB(pendingImport.candidate);
            const created = await installWorkspace(candidate, {
              year: candidate.settings.academicYear,
              term:
                (candidate.settings.academicTerm || "بازیابی") +
                " — بازیابی " +
                new Date().toLocaleTimeString("fa-IR"),
            });
            pendingImport = null;
            await switchPeriod(created.id);
            return;
          }
          if (!document.getElementById("restoreExternalConfirmed").checked) {
            handleError(
              Error("ابتدا نسخه مستقل را ذخیره و وجود فایل را تأیید کنید."),
            );
            return;
          }
          if (workspace.closed)
            throw Error(
              "دوره بسته است؛ برای بازیابی در آن ابتدا دوره را بازگشایی کنید.",
            );
          if (!confirm("اطلاعات این دوره با نسخه پیش‌نمایش جایگزین شود؟"))
            return;
          await flushDrafts({ strict: true });
          await writer.catch(() => {});
          const candidate = normalizeDB(pendingImport.candidate);
          candidate.settings.academicYear = workspace.year;
          candidate.settings.academicTerm = workspace.term;
          try {
            await putBackup(db, "پیش از بازیابی");
          } catch (error) {
            setStatus(
              "پشتیبان داخلی جا نشد؛ نسخه مستقلِ تأییدشده مسیر بازیابی است.",
              "pending",
            );
          }
          busy++;
          paintStatus();
          try {
            await commitRecords(collectRecords(candidate), {
              action: "بازیابی پشتیبان: " + pendingImport.label,
              replace: true,
              keepUndo: false,
            });
            db = candidate;
            drafts.clear();
            storeDrafts();
            pendingImport = null;
            isAuthenticated = false;
            state = {
              view: "schools",
              schoolId: null,
              classId: null,
              lessonId: null,
              tab: "students",
              reportTab: "comprehensive",
            };
            closeModal();
            setStatus("بازیابی تراکنشی انجام شد.", "saved");
          } catch (error) {
            handleError(error);
          } finally {
            busy--;
            render();
          }
        }

        async function undoLast() {
          if (fileMode)
            throw Error(
              "این عملیات را از راه‌انداز Start-EduManager.cmd انجام دهید.",
            );
          await flushDrafts({ strict: true });
          await writer.catch(() => {});
          const undo = await readRecord("undo", workspace.id);
          if (!undo || undo.revision !== workspace.revision)
            throw Error("آخرین تغییر قابل بازگردانی نیست.");
          if (!confirm("آخرین تغییر «" + undo.action + "» بازگردانده شود؟"))
            return;
          const candidate = new Map(
            [...committed].map(([k, v]) => [k, JSON.parse(v)]),
          );
          for (const oldRecord of undo.before) {
            if (oldRecord.value === null) candidate.delete(oldRecord.key);
            else candidate.set(oldRecord.key, oldRecord.value);
          }
          await commitRecords(candidate, {
            action: "بازگردانی: " + undo.action,
            replace: true,
            keepUndo: false,
          });
          const loaded = await readWorkspace(workspace.id);
          db = loaded.data;
          committed = loaded.records;
          closeModal();
          render();
          setStatus("آخرین تغییر بازگردانده شد.", "saved");
        }

        async function createNewPeriod() {
          if (fileMode)
            throw Error(
              "این عملیات را از راه‌انداز Start-EduManager.cmd انجام دهید.",
            );
          await flushDrafts({ strict: true });
          const year = asciiDigits(document.getElementById("periodYear").value),
            term = document.getElementById("periodTerm").value;
          if (
            !/^\d{4}-\d{4}$/.test(year) ||
            Number(year.slice(5)) - Number(year.slice(0, 4)) !== 1
          )
            throw Error("سال را مانند 1405-1406 وارد کنید.");
          const existing = await allFrom("catalog");
          if (existing.some((x) => x.year === year && x.term === term))
            throw Error("این سال و نوبت قبلاً ساخته شده است.");
          const next = clone(db);
          next.sessions = [];
          next.migrationWarnings = [];
          next.settings.academicYear = year;
          next.settings.academicTerm = term;
          for (const school of next.schools)
            for (const c of school.classes) {
              c.archivedStudents = [];
              for (const l of c.lessons) {
                l.kardaneshScores = {};
                if (l.gradingPolicy && l.gradingPolicy.year !== year) {
                  l.gradingPolicy.year = year;
                  l.gradingPolicy.confirmed = false;
                  l.gradingPolicy.revision = 1;
                  l.gradingPolicy.circularNumber = "";
                  l.gradingPolicy.circularDate = "";
                  l.gradingPolicy.reference = "";
                }
                if (l.courseInfo) l.courseInfo.year = year;
                for (const p of l.poudmans) p.podScores = {};
                for (const p of l.poudmans)
                  for (const u of p.units) u.unitScores = {};
              }
            }
          const created = await installWorkspace(normalizeDB(next), {
            year,
            term,
          });
          await switchPeriod(created.id);
        }

        function finalReportData() {
          const classes = [];
          let missing = [];
          for (const school of db.schools)
            for (const c of school.classes) {
              const students = getSortedStudents(c).map((st) => {
                const lessons = c.lessons.map((l) => {
                  const result = calcV24(c, l, st.id);
                  if (l.gradingPolicy && !l.gradingPolicy.confirmed)
                    missing.push(
                      c.name + " / " + l.name + " / قواعد ابلاغیه تأیید نشده",
                    );
                  if (result.final === null && result.passed !== false)
                    missing.push(c.name + " / " + st.name + " / " + l.name);
                  return {
                    id: l.id,
                    name: l.name,
                    mode: l.gradeMode,
                    policy: l.gradingPolicy ? clone(l.gradingPolicy) : null,
                    modules: result.modules || null,
                    reason: result.reason || "",
                    teacher: l.teacher || "",
                    practical: result.practical ?? null,
                    theory: result.theory ?? null,
                    mostamar: result.avgM,
                    payani: result.avgP,
                    final: result.final,
                    passed: result.passed ?? null,
                  };
                });
                return {
                  id: st.id,
                  name: st.name,
                  code: st.code || "",
                  lessons,
                  average:
                    lessons.length && lessons.every((l) => l.final !== null)
                      ? lessons.reduce((n, l) => n + l.final, 0) /
                        lessons.length
                      : null,
                };
              });
              if (c.students.length && !c.lessons.length)
                missing.push(c.name + " / بدون درس");
              classes.push({ school: school.name, name: c.name, students });
            }
          if (!classes.some((c) => c.students.length))
            missing.push("دانش‌آموزی برای صدور کارنامه وجود ندارد.");
          return { classes, missing };
        }

        async function finalizePeriod() {
          if (fileMode)
            throw Error(
              "این عملیات را از راه‌انداز Start-EduManager.cmd انجام دهید.",
            );
          await flushDrafts({ strict: true });
          await writer.catch(() => {});
          const report = finalReportData();
          if (report.missing.length) {
            handleError(
              Error(
                "بستن دوره ممکن نیست؛ نمرات ناقص: " +
                  report.missing.slice(0, 10).join(" | ") +
                  (report.missing.length > 10 ? " و موارد دیگر" : ""),
              ),
            );
            return;
          }
          if (
            !confirm(
              "دوره " +
                workspace.year +
                " / " +
                workspace.term +
                " بسته و کارنامه ثابت ثبت شود؟",
            )
          )
            return;
          await putBackup(db, "پیش از بستن دوره");
          const at = new Date().toISOString(),
            snapshot = {
              id: uid(),
              workspace: workspace.id,
              year: workspace.year,
              term: workspace.term,
              at,
              classes: report.classes,
            };
          let finalizedWorkspace;
          const tx = connection.transaction(
              ["catalog", "reports", "events", "undo"],
              "readwrite",
            ),
            done = transactionDone(tx);
          const request = tx.objectStore("catalog").get(workspace.id);
          request.onsuccess = () => {
            if (request.result.revision !== workspace.revision) {
              tx.abort();
              return;
            }
            finalizedWorkspace = {
              ...request.result,
              closed: true,
              closedAt: at,
              revision: request.result.revision + 1,
            };
            tx.objectStore("catalog").put(finalizedWorkspace);
            tx.objectStore("reports").put(snapshot);
            tx.objectStore("undo").delete(workspace.id);
            tx.objectStore("events").add({
              workspace: workspace.id,
              at,
              revision: finalizedWorkspace.revision,
              action: "بستن دوره و ثبت کارنامه ثابت",
              changes: [],
            });
          };
          await done;
          workspace = finalizedWorkspace;
          broadcast({
            workspace: workspace.id,
            revision: workspace.revision,
          });
          await openPeriods();
          render();
        }

        async function reopenPeriod() {

            )
          )
            return;
          let reopenedWorkspace;
          const tx = connection.transaction(["catalog", "events"], "readwrite"),
            done = transactionDone(tx),
            request = tx.objectStore("catalog").get(workspace.id);
          request.onsuccess = () => {
            if (request.result.revision !== workspace.revision) {
              tx.abort();
              return;
            }
            reopenedWorkspace = {
              ...request.result,
              closed: false,
              revision: request.result.revision + 1,
            };
            tx.objectStore("catalog").put(reopenedWorkspace);
            tx.objectStore("events").add({
              workspace: workspace.id,
              at: new Date().toISOString(),
              revision: reopenedWorkspace.revision,
              action: "بازگشایی دوره؛ کارنامه ثابت پیشین محفوظ است",
              changes: [],
            });
          };

          workspace = reopenedWorkspace;

            revision: workspace.revision,
          });

          render();
        }

        function averageLabel(results) {
          const complete = results.filter((x) => x.final !== null),
            missing = results.length - complete.length,
            average = complete.length
              ? complete.reduce((n, x) => n + x.final, 0) / complete.length
              : null;
          return {
            average,
            missing,
            label: missing
              ? "میانگین موقت (" +
                complete.length +
                " از " +
                results.length +
                " درس؛ " +
                missing +
                " درس ناقص)"
              : "میانگین کل نهایی",
          };
        }

        function scoreSource(c, l, p, u, sid, field) {
          if (u.unitScores?.[sid]?.[field] != null)
            return "ثبت گروهی (اولویت بالاتر)";
          const type = field === "m" ? "mostamar" : "payani";
          const x = db.sessions
            .filter(
              (x) =>
                x.classId === c.id &&
                x.lessonId === l.id &&
                x.poudmanId === p.id &&
                x.unitId === u.id &&
                x.scores.some((sc) => sc.studentId === sid && sc.type === type),
            )
            .sort(
              (a, b) =>
                b.date.localeCompare(a.date) ||
                b.period - a.period ||
                b.id.localeCompare(a.id),
            )[0];
          return x
            ? "جلسه " + faDate(x.date) + " / زنگ " + (x.period + 1)
            : "ثبت نشده";
        }

        function overviewV24(c) {
          const lessons = c.lessons || [];

            lessons.map((l) => "<th>" + esc(l.name) + "</th>").join("") +
            "<th>میانگین و وضعیت تکمیل</th></tr></thead><tbody>" +
            getSortedStudents(c)
              .map((st) => {
                const results = lessons.map((l) => calcV24(c, l, st.id)),

          const lessons = c.lessons || [],

          let html =

            " | " +

        function csvPlan(text, c) {
          const rows = parseCSV(text);
          if (rows.length < 2)
            throw Error("فایل باید سرستون و دست‌کم یک ردیف داشته باشد.");
          const headers = rows[0].map(normalizedName),
            nameIndex = headers.findIndex((x) => x.includes("نام")),
            codeIndex = headers.findIndex(
              (x) => x.includes("کد") && x.includes("دانش"),
            );
          if (nameIndex < 0) throw Error("ستون نام یافت نشد.");
          const codes = new Set(),
            names = new Set(),
            plan = [];
          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (row.length !== headers.length)
              throw Error("تعداد ستون ردیف " + (i + 1) + " معتبر نیست.");
            const name = normalizedName(row[nameIndex]),
              code = codeIndex < 0 ? "" : asciiDigits(row[codeIndex]);
            if (!name || name.includes("مثال:")) continue;
            if (name.length > 200 || /[\r\n<>]/.test(name) || code.length > 100)
              throw Error("نام یا کد ردیف " + (i + 1) + " معتبر نیست.");
            if (code && codes.has(code))
              throw Error("کد " + code + " در فایل تکراری است.");
            if (code) codes.add(code);
            const exact = code
                ? knownStudents(c).find((st) => st.code === code)
                : null,
              sameName =
                c.students.some((st) => normalizedName(st.name) === name) ||
                names.has(name);
            plan.push({
              row: i + 1,
              name,
              code,
              existingId: exact?.id || null,
              archived: exact
                ? !c.students.some((st) => st.id === exact.id)
                : false,
              duplicate: !exact && sameName,
              choice: exact ? "skip" : sameName ? "skip" : "add",
            });
            names.add(name);
          }
          return plan;
        }

        async function commitCSV() {
          if (!pendingCSV || pendingCSV.workspace !== workspace.id)
            throw Error("پیش‌نمایش منقضی شده است.");
          const c = findClass(pendingCSV.classId);
          if (!c) throw Error("کلاس موجود نیست.");
          const before = clone(c.students);
          let added = 0,
            updated = 0;
          try {
            for (let i = 0; i < pendingCSV.plan.length; i++) {
              const r = pendingCSV.plan[i],
                choice = document.querySelector(
                  '[data-csv-row="' + i + '"]',
                ).value;
              if (choice === "add" && !r.existingId) {
                c.students.push({
                  id: uid(),
                  name: r.name,
                  ...(r.code ? { code: r.code } : {}),
                });
                added++;
              } else if (choice === "update" && r.existingId && !r.archived) {
                const st = c.students.find((st) => st.id === r.existingId);
                if (!st) throw Error("دانش‌آموز مقصد تغییر کرده است.");
                st.name = r.name;
                updated++;
              }
            }
            await saveDBV24({
              classId: c.id,
              action:
                "ورود CSV با پیش‌نمایش: " +
                added +
                " افزوده، " +
                updated +
                " اصلاح",
            });
            pendingCSV = null;
            closeModal();
            render();
            setStatus(
              "CSV اعمال شد: " + added + " افزوده و " + updated + " اصلاح.",
              "saved",
            );
          } catch (error) {
            c.students = before;
            handleError(error);
          }
        }

        async function saveStudent(sid) {

            st.recovered = false;

            const unresolved = db.schools.some((s) =>
              s.classes.some((cl) =>
                knownStudents(cl).some((x) => x.id === sid && x.recovered),
              ),
            );
            if (!unresolved)
              db.migrationWarnings = (db.migrationWarnings || []).filter(
                (message) => !message.includes(sid),

            ...(wasRecovered ? {} : { classId: c.id }),

        }

        async function confirmWipe() {
          if (fileMode)
            throw Error(
              "این عملیات را از راه‌انداز Start-EduManager.cmd انجام دهید.",
            );

              "catalog",
              "events",
              "backups",
              "reports",
              "undo",

            tx = connection.transaction(stores, "readwrite"),
            done = transactionDone(tx);
          for (const name of stores) tx.objectStore(name).clear();
          await done;
          for (const key of Object.keys(localStorage))
            if (
              key.startsWith("Edu24.") ||

        function installUI() {
          const style = document.createElement("link");
          style.rel = "stylesheet";
          style.href = "edumanager-v24.css";
          if (!globalThis.__EDU_SINGLE_FILE__) document.head.append(style);
          window.addEventListener("beforeunload", (event) => {
            if (busy || drafts.size || draftRecoveryFailed) {
              event.preventDefault();
              event.returnValue = "";
            }
          });
          window.addEventListener("pagehide", () => {
            if (ready) storeDrafts();
            tabClaimed = false;
            channel?.close();
          });
          window.addEventListener("pageshow", (event) => {
            if (event.persisted) location.reload();
          });
          window.addEventListener("unhandledrejection", (event) => {
            event.preventDefault();
            handleError(
              event.reason instanceof Error
                ? event.reason
                : Error(String(event.reason)),
            );
          });
          window.addEventListener("beforeprint", () => {
            if (!document.getElementById("printRoot") && ready) {
              if (drafts.size) {
                const root = document.createElement("div");
                root.id = "printRoot";
                root.textContent =
                  "چاپ انجام نشد: ابتدا ورودی‌های ذخیره‌نشده را اصلاح یا لغو کنید.";
                document.body.append(root);
              } else preparePrint(null);
            }
          });
          window.addEventListener("afterprint", () => {
            document.getElementById("printRoot")?.remove();
            document.getElementById("printPageStyle")?.remove();
          });
          document.addEventListener("keydown", (event) => {
            const overlay = document.getElementById("modal");
            if (overlay.classList.contains("hidden")) return;
            if (event.key === "Escape") {
              if (drafts.size) {
                flushDrafts({ strict: true })
                  .then(() => closeModal())
                  .catch(handleError);
              } else closeModal();
              return;
            }
            if (event.key === "Tab") {
              const nodes = [
                ...overlay.querySelectorAll(
                  "button,input,select,textarea,a[href],[tabindex]",
                ),
              ].filter((el) => !el.disabled && el.offsetParent !== null);
              if (nodes.length) {
                const first = nodes[0],
                  last = nodes[nodes.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                  event.preventDefault();
                  last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                  event.preventDefault();
                  first.focus();
                }
              }
            }
          });
          if (channel)
            channel.onmessage = (event) => {
              const message = event.data;
              if (tabMessage(message)) return;
              if (
                workspace &&
                message.workspace === workspace.id &&
                message.revision > workspace.revision
              ) {
                blocked = true;
                for (const item of drafts.values()) {
                  item.review = true;
                  item.error = "تعارض؛ نیازمند بررسی پس از بارگذاری مجدد";
                }
                if (drafts.size) storeDrafts();
                setStatus(
                  "داده این دوره در تب دیگری تغییر کرد. پیش‌نویس محفوظ است؛ صفحه را دوباره بارگذاری کنید.",
                  "error",
                );
                lockControls();
              }
            };
        }

        function changeLabel(path) {
          const fields = {
            practical: "عملی",
            theory: "تئوری",
            final: "نهایی",
            passed: "قبولی",
            c: "شایستگی",
            gate: "معیارهای الزامی",
            gradingPolicy: "قواعد ابلاغیه",
            podScores: "نمرات پودمان",
            m: "مستمر",
            p: "پایانی",
            name: "نام",
            code: "کد",
            date: "تاریخ",
            period: "زنگ",
            poudmanId: "پودمان",
            unitId: "واحد",
            attendance: "حضور و غیاب",
            password: "رمز ورود",
            academicYear: "سال تحصیلی",
            academicTerm: "نوبت",
            masterSchedule: "برنامه هفتگی",
          };
          const pieces = path.split("."),
            record = pieces.shift();
          let label =
            record === "meta"
              ? "تنظیمات"
              : record.startsWith("class:")
                ? findClass(record.slice(6))?.name || "کلاس حذف‌شده"
                : record.startsWith("session:")
                  ? "جلسه " +
                    (faDate(getSessionById(record.slice(8))?.date) || "حذف‌شده")
                  : "اطلاعات";
          let c = record.startsWith("class:")
            ? findClass(record.slice(6))
            : findClass(getSessionById(record.slice(8))?.classId);
          for (let i = 0; i < pieces.length; i++) {
            const key = pieces[i];
            if (key === "lessons" && c) {
              const l = c.lessons[Number(pieces[++i])];
              if (l) label += " / " + l.name;
              continue;
            }
            if (
              [
                "kardaneshScores",
                "unitScores",
                "podScores",
                "attendance",
              ].includes(key)
            ) {
              const sid = pieces[++i];
              label += " / " + (getStudentObj(c, sid)?.name || "دانش‌آموز");
              continue;
            }
            if (fields[key]) label += " / " + fields[key];
          }
          return label;
        }

        function tabMessage(message) {
          if (message.type === "claim-tab") {
            if (
              message.tabId === tabId &&
              message.documentToken !== documentToken &&
              (tabClaimed || documentToken < message.documentToken)
            )
              broadcast({
                type: "tab-alive",

                to: message.documentToken,

            return true;

          return false;

                  items: Array.isArray(raw) ? raw : raw?.entries || [],
                  generation: Array.isArray(raw)
                    ? 0
                    : Number(raw?.generation || 0),
                  at: raw?.updatedAt || "",
                },
                otherTab = key.slice(prefix.length).split(".")[0],
                old = byTab.get(otherTab);
              if (
                !old ||

                (entry.generation === old.generation && entry.at > old.at)
