<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>کلاس‌یار</title>

    <meta name="theme-color" content="#58595b" />
    <meta name="application-name" content="کلاس‌یار" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="کلاس‌یار" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link id="appStyles" rel="stylesheet" href="./assets/styles/app.css" />
    <link rel="preload" as="image" href="./assets/logo3.png" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/icons/logo-180.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/icons/logo-32.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      id="daily-workflow-styles"
      rel="stylesheet"
      href="./assets/styles/daily-workflow.css"
    />
  </head>
  <body>
    <div class="cal-popup" id="calPopup"></div>
    <a class="skip-link" href="#app">رفتن به محتوای اصلی</a>
    <main id="app" tabindex="-1"></main>
    <div id="modal" class="modal-overlay hidden">
      <div
        class="modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        tabindex="-1"
      >
        <div class="modal-header">
          <h3 id="modalTitle"></h3>
          <button type="button" id="modalClose" aria-label="بستن پنجره">
            ×
          </button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
    <input
      type="file"
      id="importFile"
      hidden
      accept=".json,.txt,application/json,text/plain"
    />
    <input type="file" id="excelFile" hidden accept=".csv" />
    <script src="./assets/scripts/data-store-schema.js"></script>
    <script src="./assets/scripts/data-store-runtime.js"></script>
    <script src="./assets/scripts/data-store.js"></script>
    <script src="./assets/scripts/runtime-api.js"></script>
    <script src="./assets/scripts/icons.js"></script>

    <script src="./assets/scripts/data-boundary.js"></script>
    <script src="./assets/scripts/calendar-math.js"></script>
    <script src="./assets/scripts/calendar-ui.js"></script>
    <script src="./assets/scripts/legacy-ui.js"></script>
    <script src="./assets/scripts/csv-parser.js"></script>
    <script src="./assets/scripts/password-service.js"></script>
    <script src="./assets/scripts/dialogs-ui.js"></script>
    <script src="./assets/scripts/grade-policy.js"></script>
    <script src="./assets/scripts/reporting-core.js"></script>
    <script src="./assets/scripts/course-ui.js"></script>
    <script src="./assets/scripts/workspace-records.js"></script>
    <script src="./assets/scripts/history-changes.js"></script>
    <script src="./assets/scripts/record-commit-plan.js"></script>
    <script src="./assets/scripts/record-transaction.js"></script>
    <script src="./assets/scripts/full-backup-validator.js"></script>
    <script src="./assets/scripts/frozen-report-validator.js"></script>
    <script src="./assets/scripts/undo-validator.js"></script>
    <script src="./assets/scripts/grade-drafts.js"></script>
    <script src="./assets/scripts/deputy-exchange.js"></script>
    <script src="./assets/scripts/workspace-runtime.js"></script>
    <!-- PWA bootstrap is intentionally externalized before larger UI modules. -->
    <script src="./assets/scripts/pwa-manifest.js"></script>
    <script src="./assets/scripts/app-shell-ui.js"></script>
    <script src="./assets/scripts/pwa-ui.js"></script>
    <script src="./assets/scripts/periodic-reports.js"></script>
