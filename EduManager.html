              });
          enhance();
          viewport();
          window.visualViewport?.addEventListener("resize", viewport);
          window.addEventListener("resize", viewport);
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", start);
        else start();
      })();
    </script>
    <script>
      (function () {
        "use strict";
        let registration,
          installEvent,
          pendingUpdate = false,
          offlineReady = false;
        function text(message) {
          const el = document.getElementById("mobileStatus");
          if (el) el.textContent = message;
        }
        function paint() {
          if(!document.getElementById("mobileInstall"))return;
          if(location.protocol==="file:"){text("فایل مستقل آفلاین؛ نصب PWA از لینک امن انجام می‌شود.");return;}
          const status = offlineReady
            ? navigator.onLine
              ? "آماده اجرای آفلاین"
              : "آفلاین — اطلاعات روی دستگاه ذخیره می‌شود"
            : "در حال آماده‌سازی اجرای آفلاین…";
          text(status);
          document.getElementById("mobileInstall").hidden = !installEvent || matchMedia("(display-mode: standalone)").matches || !!navigator.standalone;
          document.getElementById("mobileUpdate").hidden =
            !registration?.waiting;
        }
        function shell() {
          const bar = document.createElement("aside");
          bar.className = "mobile-bar no-print";
          bar.id = "mobileBar";
          bar.innerHTML =
            '<strong>مدیریت کلاس</strong><span id="mobileStatus" role="status" aria-live="polite"></span><button id="mobileInstall" hidden>نصب برنامه</button><button id="mobileUpdate" hidden>نسخه جدید آماده است</button><button id="mobileHelp" class="ghost">نصب و راهنما</button>';
          document.body.prepend(bar);
          document.getElementById("mobileInstall").onclick = async () => {
            if (!installEvent) return;
            const event = installEvent;
            installEvent = null;
            await event.prompt();
            await event.userChoice;
            paint();
          };
          document.getElementById("mobileUpdate").onclick = update;
          document.getElementById("mobileHelp").onclick = help;
        }
        function help() {
          const installed =
            matchMedia("(display-mode: standalone)").matches ||
            navigator.standalone;
          const html =
            "<p>" +
            (installed
              ? "برنامه از آیکن نصب‌شده اجرا شده است."
              : "در اندروید و رایانه از گزینه «نصب برنامه» مرورگر استفاده کنید. در آیفون و آیپد از اشتراک‌گذاری و «افزودن به صفحه اصلی» استفاده کنید.") +
            "</p><p>دریافت اولیه و به‌روزرسانی به اینترنت نیاز دارد. بعد از نمایش «آماده اجرای آفلاین»، برنامه بدون اینترنت باز می‌شود. یک بار از آیکن نصب‌شده باز کنید و آماده‌بودن را بررسی کنید.</p><p>اطلاعات هر دستگاه و مرورگر جداست. برای انتقال اطلاعات، از داده‌ها «پشتیبان» بگیرید و فایل را در دستگاه دیگر بازیابی کنید. پاک‌کردن داده‌های مرورگر یا حذف برنامه ممکن است اطلاعات این دستگاه را پاک کند؛ فایل مستقل را نگه دارید.</p><p>این برنامه همگام‌سازی خودکار بین دستگاه‌ها ندارد.</p>";
          if (window.showModal) showModal("نصب و استفاده آفلاین", html);
          else
            alert(
              "پس از نمایش آماده اجرای آفلاین، برنامه را از منوی مرورگر روی صفحه اصلی نصب کنید.",
            );
        }
        async function status() {
          const worker =
            navigator.serviceWorker.controller || registration?.active;
          if (!worker) return;
          const channel = new MessageChannel();
          channel.port1.onmessage = (e) => {
            offlineReady = e.data?.ready === true;
            paint();
            channel.port1.close();
          };
          worker.postMessage({ type: "OFFLINE_STATUS" }, [channel.port2]);
        }
        async function update() {
          if (!registration?.waiting || pendingUpdate) return;
          try {
            await window.EduV24?.flushDrafts({ strict: true });
            if (
              !confirm(
                "ویرایش‌های معتبر ذخیره شدند. نسخه جدید برنامه دریافت شده است؛ اکنون برنامه باز شود؟",
              )
            )
              return;
            pendingUpdate = true;
            document.getElementById("mobileUpdate").disabled = true;
            text("در حال اعمال نسخه جدید…");
            registration.waiting.postMessage({ type: "APPLY_UPDATE" });
          } catch (e) {
            text(e.message || "ابتدا ویرایش‌های ذخیره‌نشده را بررسی کنید.");
          }
        }
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          installEvent = e;
          paint();
        });
        window.addEventListener("appinstalled", () => {
          installEvent = null;
          paint();
        });
        window.addEventListener("online", paint);
        window.addEventListener("offline", paint);
        document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&navigator.onLine)registration?.update().catch(()=>{}); });
        window.addEventListener("load", async () => {
          shell();
          if (location.protocol === "file:") {
            text(
              "فایل مستقل آفلاین؛ نصب استاندارد PWA از لینک امن انجام می‌شود.",
            );
            return;
          }
          if (!("serviceWorker" in navigator) || !window.isSecureContext) {
            text("نصب آفلاین به مرورگر جدید و لینک HTTPS نیاز دارد.");
            return;
          }
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (pendingUpdate) location.reload();
            else status();
          });
          navigator.serviceWorker.addEventListener("message", (e) => {
            if (e.data?.type === "UPDATE_BLOCKED") {
              pendingUpdate = false;
              document.getElementById("mobileUpdate").disabled = false;
              text(
                "برای به‌روزرسانی، تب‌ها و پنجره‌های دیگر همین برنامه را ببندید.",
              );
            }
          });
          try {
            registration = await navigator.serviceWorker.register(
              "./service-worker.js",
              { updateViaCache: "none" },
            );
            function watchInstalling() {
              const worker=registration.installing;
              worker?.addEventListener("statechange",()=>{
                if(worker.state==="installed"){paint();status();}
                if(worker.state==="redundant"&&!offlineReady)text("دانلود آفلاین کامل نشد؛ اینترنت را بررسی و دوباره تلاش کنید.");
              });
            }
            registration.addEventListener("updatefound",watchInstalling);
            watchInstalling();
            await Promise.race([navigator.serviceWorker.ready,new Promise((_,reject)=>setTimeout(()=>reject(Error("Offline setup timed out")),30000))]);
            await status();
            paint();
          } catch (e) {
            text(
              "آماده‌سازی آفلاین کامل نشد؛ اینترنت را بررسی و برنامه را دوباره باز کنید.",
            );
          }
        });
        window.EduPWA = {
          getStatus: () => ({
            offlineReady,
            waiting: !!registration?.waiting,
            installed:
              matchMedia("(display-mode: standalone)").matches ||
              !!navigator.standalone,
          }),
          help,
        };
      })();
    </script>
  </body>
</html>
